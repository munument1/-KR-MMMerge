[Validator]
; 1 = enable automatic validation at game startup and text reload
Enabled=0

; Write a detailed report to Data/KO_LocalizationValidation.log
WriteReport=1

; Log every individual issue to the MMExtension log.
; Keep this at 0 for normal releases to avoid log spam.
LogEachIssue=0

; Log a line for every file that passes without issues.
LogPassedFiles=0

; Check that all localization files shipped with this Korean release exist.
CheckExpectedFiles=1

; Relative to the game directory.
ReportPath=Data/KO_LocalizationValidation.log

; Compare every successfully applied localization record with the final runtime value.
CheckRuntimeValues=1

; Inspect known Lua-side caches that can preserve English copies after initialization.
CheckDerivedCaches=1

; Prevent a broken table from producing an excessively large report.
MaxRuntimeIssues=200
