name: Apply report 66263 terminology

on:
  push:
    branches:
      - fix/report-66263-final-terminology
    paths:
      - tools/apply_report_66263_terminology.py
      - tools/SPELL_TERMINOLOGY.tsv
      - tools/normalize_spell_names.py
      - tools/patch_reported_terms_lod.py
      - .github/workflows/apply-report-66263.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-report-66263-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PO dependency
        run: python -m pip install --disable-pip-version-check polib

      - name: Apply report 66263 terminology
        run: python tools/apply_report_66263_terminology.py .

      - name: Require complete reviewed PO
        shell: bash
        run: |
          set -euo pipefail
          python tools/po_catalog_stats.py \
            translations/ko/mmmerge.po \
            --baseline translations/ko/PO_BASELINE.json \
            --no-regress \
            --fail-fuzzy \
            --min-translated 25051

      - name: Materialize Korean runtime sources
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_korean_from_po.py --write
          python tools/build_mm8lang_from_po.py --write
          python tools/rebuild_runtime_overrides.py --write
          python tools/rebuild_runtime_overrides.py --check
          python tools/rebuild_stats_skills_runtime.py --write
          python tools/rebuild_stats_skills_runtime.py --check

      - name: Synchronize static localization LOD
        shell: bash
        run: |
          set -euo pipefail
          LOD="Data/zz LocKO.T.lod"

          python tools/patch_static_global_lod.py \
            --lod "$LOD" \
            --overlay "Data/Text localization/KO_GlobalTxt.txt" \
            --output /tmp/report66263-global.lod
          mv /tmp/report66263-global.lod "$LOD"

          python tools/patch_static_spells_lod.py \
            --lod "$LOD" \
            --overlay "Data/Text localization/KO_SpellsTxt.txt" \
            --output /tmp/report66263-spells.lod
          mv /tmp/report66263-spells.lod "$LOD"

          python tools/patch_static_stats_lod.py \
            --lod "$LOD" \
            --translations "Data/Text localization/KO_StatsDescriptions.tsv" \
            --output /tmp/report66263-stats.lod
          mv /tmp/report66263-stats.lod "$LOD"

          python tools/patch_static_map_strings_lod.py \
            --lod "$LOD" \
            --translations "Data/Text localization/KO_MapStrings.txt" \
            --output /tmp/report66263-maps.lod
          mv /tmp/report66263-maps.lod "$LOD"


          python tools/patch_reported_terms_lod.py \
            --lod "$LOD" \
            --output /tmp/report66263-reported.lod
          mv /tmp/report66263-reported.lod "$LOD"

      - name: Validate report and localization
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_report_66263_terminology.py .
          python tools/validate_parser_sensitive_localization.py
          python tools/validate_spell_names.py .
          python tools/patch_static_map_strings_lod.py \
            --lod "Data/zz LocKO.T.lod" \
            --translations "Data/Text localization/KO_MapStrings.txt" \
            --check
          python tools/patch_static_stats_lod.py \
            --lod "Data/zz LocKO.T.lod" \
            --translations "Data/Text localization/KO_StatsDescriptions.tsv" \
            --check
          python tools/patch_reported_terms_lod.py \
            --lod "Data/zz LocKO.T.lod" \
            --check

          rm -rf build/po-report-66263-check
          python tools/build_korean_from_po.py \
            --output-root build/po-report-66263-check \
            --require-byte-identical
          python tools/build_mm8lang_from_po.py \
            --output build/mm8lang-report-66263-check.ini \
            --require-byte-identical

          mkdir -p build
          python tools/audit_runtime_translation_ownership.py \
            --json build/RUNTIME_TRANSLATION_OWNERSHIP.json
          python tools/audit_lua_korean_literals.py \
            --json build/LUA_KOREAN_LITERAL_AUDIT.json
          git diff --check

      - name: Commit synchronized report fixes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- translations/ko/mmmerge.po 'Data/Text localization' mm8lang.ini 'Data/zz LocKO.T.lod')" ]]; then
            echo "Report 66263 terminology is already synchronized."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/ko/mmmerge.po 'Data/Text localization' mm8lang.ini 'Data/zz LocKO.T.lod'
          git commit -m 'fix(i18n): apply RPG report 66263 terminology'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
