name: Patch PO materializer quote handling

on:
  push:
    branches:
      - po-localization-bootstrap
    paths:
      - .github/workflows/patch-po-materializer-quotes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch materializer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('tools/build_korean_from_po.py')
          text = p.read_text(encoding='utf-8')

          needle = '''def parse_long_semantics(text: str):\n'''
          insert = '''def decode_field(raw: str) -> str:\n    if len(raw) >= 2 and raw.startswith('"') and raw.endswith('"'):\n        return raw[1:-1].replace('""', '"')\n    return raw\n\n\ndef parse_long_semantics(text: str):\n'''
          if 'def decode_field(raw: str)' not in text:
              if needle not in text:
                  raise SystemExit('parse_long_semantics marker not found')
              text = text.replace(needle, insert, 1)

          old = '''            values[key] = parts[3]\n            order.append(key)\n            starts.append((idx, key, parts[:3]))\n            current_key = key\n'''
          new = '''            raw_value = parts[3]\n            quoted = len(raw_value) >= 2 and raw_value.startswith('"') and raw_value.endswith('"')\n            values[key] = decode_field(raw_value)\n            order.append(key)\n            starts.append((idx, key, parts[:3], quoted))\n            current_key = key\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('long parse assignment block not found')

          old = '''    start_by_index = {idx: (key, prefix) for idx, key, prefix in starts}\n'''
          new = '''    start_by_index = {idx: (key, prefix, quoted) for idx, key, prefix, quoted in starts}\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('start_by_index block not found')

          old = '''        key, prefix = start\n        end = next_start[i]\n'''
          new = '''        key, prefix, quoted = start\n        end = next_start[i]\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('start unpack block not found')

          old = '''        value_lines = desired[key].split("\\n")\n        first = value_lines[0] if value_lines else ""\n        out.append("\\t".join([*prefix, first]))\n'''
          new = '''        value_lines = desired[key].split("\\n")\n        first = value_lines[0] if value_lines else ""\n        if quoted:\n            if len(value_lines) != 1:\n                raise ValueError(\n                    f"cannot safely rewrite quoted long-table record {key} as multiline text"\n                )\n            first = '"' + first.replace('"', '""') + '"'\n        out.append("\\t".join([*prefix, first]))\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('long writer block not found')

          p.write_text(text, encoding='utf-8', newline='')
          PY

          python -m py_compile tools/build_korean_from_po.py

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- tools/build_korean_from_po.py)" ]]; then
            echo 'Materializer already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build_korean_from_po.py
          git commit -m 'fix(i18n): preserve quoted long-table fields in PO round trip'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
