# v1.0.20 is frozen. Historical releases must never be rebuilt from a later main.
name: Release v1.0.20 (frozen)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen:
    runs-on: ubuntu-latest
    steps:
      - name: Explain frozen release
        run: |
          echo "v1.0.20 is immutable. Create a new versioned release instead."
