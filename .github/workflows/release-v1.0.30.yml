# v1.0.30 release workflow.
# Fixes MM6 Tomb of VARN / long map-event text overflows by storing translated
# map STR strings as native CP949 instead of legacy expanded DBCS markers.
name: Release v1.0.30

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.0.30.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.0.30
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check polib
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 >/dev/null

      - name: Validate canonical localization sources
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          python tools/po_catalog_stats.py \
            translations/ko/mmmerge.po \
            --baseline translations/ko/PO_BASELINE.json \
            --no-regress --fail-fuzzy --min-translated 25051
          rm -rf build/po-release-roundtrip
          python tools/build_korean_from_po.py \
            --output-root build/po-release-roundtrip \
            --require-byte-identical
          python tools/build_mm8lang_from_po.py \
            --output build/mm8lang-release-roundtrip.ini \
            --require-byte-identical
          python tools/rebuild_runtime_overrides.py --check
          python tools/rebuild_stats_skills_runtime.py --check
          python tools/audit_runtime_translation_ownership.py --json build/runtime-ownership-release.json
          python tools/audit_lua_korean_literals.py --json build/lua-korean-literals-release.json

      - name: Validate map event-text migration and regressions
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_static_map_strings_lod.py \
            --translations "Data/Text localization/KO_MapStrings.txt" \
            --audit
          python tools/patch_static_map_strings_lod.py \
            --lod "Data/zz LocKO.T.lod" \
            --translations "Data/Text localization/KO_MapStrings.txt" \
            --check
          if grep -Fq 'encoded = encode_dbcs_special(encode_mixed_text(value))' tools/build_static_localization.py; then
            echo 'legacy map STR marker encoder regressed into build_static_localization.py' >&2
            exit 1
          fi
          python -m py_compile tools/build_static_localization.py tools/patch_static_map_strings_lod.py

          python tools/validate_native_dbcs_integration.py .
          python tools/validate_rodril_overlay_boundary.py
          python tools/audit_rodril_localizer_semantics.py
          python tools/audit_rodril_follower_topic_aliases.py
          python tools/validate_korean_history_encoding.py
          python tools/validate_reported_localization_fixes.py .
          python tools/validate_report_65949.py .
          python tools/validate_report_65949_followup.py .
          python tools/validate_report_65949_item_review2.py .
          python tools/validate_report_65949_item_review3.py .
          python tools/validate_report_65949_item_review4.py .
          python tools/validate_report_65949_item_review5.py .
          python tools/validate_report_65960.py .
          python tools/patch_reported_terms_lod.py \
            --lod "Data/zz LocKO.T.lod" \
            --check
          python tools/patch_static_stats_lod.py \
            --lod "Data/zz LocKO.T.lod" \
            --translations "Data/Text localization/KO_StatsDescriptions.tsv" \
            --check
          python tools/validate_korean_movie_subtitles.py .

          python - <<'PY'
          from pathlib import Path
          text = Path('Data/Text localization/KO_StatsSkillsRuntime.txt').read_bytes().decode('euc_kr')
          current = ''
          ids = []
          for line in text.splitlines()[1:]:
              parts = line.split('\t', 3)
              if len(parts) < 4:
                  continue
              if parts[0]:
                  current = parts[0]
              if current == 'StatsDescriptions' and parts[1].isdigit():
                  ids.append(int(parts[1]))
          assert ids == list(range(7)), ids
          print('StatsDescriptions runtime bounds: 0..6 OK')
          PY

          for f in \
            Scripts/General/FNT_DBCS.lua \
            Scripts/General/KoreanMovieSubtitles.lua \
            Scripts/General/LocalizeTables.lua \
            Scripts/General/ZZ_KoreanRodrilNumericLocalization.lua \
            Scripts/General/ZZ_KoreanReportedLocalization.lua \
            tools/test_localize_tables_upstream_semantics.lua \
            tools/test_korean_movie_subtitles.lua \
            tools/test_korean_rodril_numeric_localization.lua; do
            luac5.1 -p "$f"
          done
          lua5.1 tools/test_localize_tables_upstream_semantics.lua
          lua5.1 tools/test_korean_movie_subtitles.lua
          lua5.1 tools/test_korean_rodril_numeric_localization.lua

      - name: Build clean release package
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v1.0.30"
          ASSET="MMMerge_Korean_${VERSION}_Release.zip"
          rm -rf release-stage
          mkdir -p release-stage
          cp -a Data release-stage/
          cp -a DataFiles release-stage/
          cp -a Scripts release-stage/
          cp mm8lang.ini release-stage/
          cp FONT_LICENSES.md release-stage/

          cat > release-stage/README.txt <<'EOF'
          MMMerge 한국어 패치 v1.0.30

          설치:
          1) Rodril MMMerge를 먼저 설치합니다.
          2) 이 ZIP의 내용을 게임 폴더에 그대로 덮어씁니다.
          3) 게임을 완전히 종료했다가 다시 실행합니다.

          v1.0.20~v1.0.29 사용자는 그대로 덮어쓰면 됩니다.
          v1.0.19 이하 사용자는 Rodril MMMerge 원본을 먼저 다시 적용한 뒤 설치하십시오.

          v1.0.30 핵심 변경:
          - MM6 VARN의 무덤 진입 시 "max event text length needs to be increased" 오류 수정
          - 맵 STR 한국어 852개를 레거시 DBCS 마커 저장에서 native CP949 저장으로 전환
          - 같은 원인으로 한도를 넘던 PYRAMID.STR 53/54와 SCI-FI.STR 14를 함께 수정
          - 모든 852개 맵 문자열이 native CP949 기준 이벤트 텍스트 안전 한도 이내인지 자동 검증
          - 향후 정적 현지화 빌드도 맵 STR에 레거시 마커를 다시 씌우지 않도록 생성 경로 수정
          - v1.0.29의 스탯 도움말/NPC/번역/자막 수정 포함

          저장소: https://github.com/munument1/-KR-MMMerge
          EOF

          test ! -f release-stage/Scripts/Maps/out01.lua
          test -f release-stage/Scripts/General/LocalizeTables.lua
          test -f release-stage/Scripts/General/ZZ_KoreanRodrilNumericLocalization.lua
          test -f release-stage/Scripts/General/ZZ_KoreanReportedLocalization.lua
          test -f release-stage/Scripts/General/KoreanMovieSubtitles.lua
          test -d "release-stage/Data/Korean Subtitles"
          test "$(find 'release-stage/Data/Korean Subtitles' -type f -name '*.srt' | wc -l)" -eq 19

          python tools/patch_static_map_strings_lod.py \
            --lod "release-stage/Data/zz LocKO.T.lod" \
            --translations "release-stage/Data/Text localization/KO_MapStrings.txt" \
            --check
          python tools/patch_static_stats_lod.py \
            --lod "release-stage/Data/zz LocKO.T.lod" \
            --translations "release-stage/Data/Text localization/KO_StatsDescriptions.tsv" \
            --check

          python - <<'PY'
          from pathlib import Path
          text = Path('release-stage/Data/Text localization/KO_StatsSkillsRuntime.txt').read_bytes().decode('euc_kr')
          current = ''
          ids = []
          for line in text.splitlines()[1:]:
              parts = line.split('\t', 3)
              if len(parts) < 4:
                  continue
              if parts[0]:
                  current = parts[0]
              if current == 'StatsDescriptions' and parts[1].isdigit():
                  ids.append(int(parts[1]))
          assert ids == list(range(7)), ids
          print('packaged StatsDescriptions runtime bounds: 0..6 OK')
          PY

          (
            cd release-stage
            zip -9 -X -r "../${ASSET}" .
          )
          ZIP_SHA="$(sha256sum "${ASSET}" | awk '{print $1}')"
          printf '%s  %s\n' "${ZIP_SHA}" "${ASSET}" > "${ASSET}.sha256"

          cat > release-notes.md <<'EOF'
          ## MMMerge 한국어 패치 v1.0.30

          MM6 **VARN의 무덤(Tomb of VARN)** 진입 시 발생하던 이벤트 텍스트 길이 오류를 수정한 안정화 릴리즈입니다.

          ### VARN 진입 오류 수정
          - 오류: `max event text length needs to be increased to 1101`
          - 원인은 번역문 자체가 지나치게 긴 것이 아니라, 한국어 맵 STR을 예전 호환용 DBCS 마커 형식으로 저장하면서 문자열 바이트 수가 크게 팽창하던 것이었습니다.
          - 현재 한국어 렌더러는 native CP949/DBCS를 직접 처리하므로, 맵 STR의 한국어 문자열을 marker-free native CP949로 이관했습니다.

          ### 유사 문제 전수 검사
          `KO_MapStrings.txt`의 852개 번역을 전부 검사했습니다.
          - native CP949 기준: 852개 전부 1023바이트 이하
          - 구형 마커 기준으로 한도를 넘던 항목: 3개
            - `PYRAMID.STR[53]`: 1099 → 431 bytes
            - `PYRAMID.STR[54]`: 1034 → 408 bytes
            - `SCI-FI.STR[14]`: 1157 → 457 bytes
          - 배포 LOD의 170개 STR 멤버 / 852개 번역 문자열을 전부 native CP949로 변환하고 재검증했습니다.

          ### 재발 방지
          - `build_static_localization.py`의 맵 STR 생성 경로도 native CP949를 쓰도록 수정했습니다.
          - CI가 852개 맵 문자열의 바이트 길이, LOD 실제 저장 형식, 기존 native stats 저장 방식을 함께 검증합니다.

          ### 기존 수정 포함
          v1.0.29의 스탯 우클릭 도움말, 학자/교사/강사 학습 보너스, 제보 번역/용어 교정, 컷신 자막 및 기존 회귀 수정도 모두 포함합니다.

          ### 설치
          - v1.0.20~v1.0.29: ZIP 내용을 그대로 덮어쓴 뒤 게임을 완전히 종료/재실행하십시오.
          - v1.0.19 이하: Rodril MMMerge 원본을 먼저 재적용한 뒤 설치하십시오.
          EOF
          printf '\nZIP SHA-256:\n\n%s\n' "$ZIP_SHA" >> release-notes.md
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.30"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
            --target "$GITHUB_SHA" \
            --title "MMMerge 한국어 패치 v1.0.30" \
            --notes-file release-notes.md \
            --latest
