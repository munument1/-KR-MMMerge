name: Validate native DBCS

on:
  push:
    branches:
      - main
      - fix/native-dbcs-ui-renderer
    paths:
      - Scripts/General/FNT_DBCS.lua
      - Scripts/General/KoreanFont.lua
      - Scripts/General/KoreanFontText.lua
      - Scripts/General/ZZ_KoreanGameplayFeedbackFixes.lua
      - Scripts/General/ZZ_KoreanReportedLocalization.lua
      - Scripts/General/ZZ_KoreanEmeraldWellTimerFix.lua
      - Scripts/General/ZZZ_KoreanExtraSettingsOverlay.lua
      - Scripts/General/ZZZZ_KoreanRuntimeHotfix.lua
      - Data/LocalizeConf.ini
      - "Data/Text localization/KO_*.txt"
      - Data/Text localization/KO_StatsDescriptions.tsv
      - Data/Text localization/MM7History_KO.txt
      - Data/zz LocKO.T.lod
      - Data/zz LocKO.icons.lod
      - DataFiles/DBCS_*.fnt
      - tools/apply_reported_term_fixes.py
      - tools/patch_reported_terms_lod.py
      - tools/patch_static_stats_lod.py
      - tools/validate_native_dbcs_integration.py
      - tools/validate_reported_localization_fixes.py
      - tools/apply_report_65949_fixes.py
      - tools/run_report_65949_source_fixes.py
      - tools/patch_report_65949_lod.py
      - tools/validate_report_65949.py
      - tools/apply_report_65949_followup_fixes.py
      - tools/patch_report_65949_followup_lod.py
      - tools/validate_report_65949_followup.py
      - tools/apply_report_65949_item_review2.py
      - tools/validate_report_65949_item_review2.py
      - tools/apply_report_65949_item_review3.py
      - tools/validate_report_65949_item_review3.py
      - tools/apply_report_65949_item_review4.py
      - tools/validate_report_65949_item_review4.py
      - tools/apply_report_65949_item_review5.py
      - tools/validate_report_65949_item_review5.py
      - tools/build_korean_extra_settings_icons.py
      - tools/test_emerald_well_timer_fix.lua
      - tools/test_korean_extra_settings_overlay.lua
      - tools/test_korean_runtime_hotfix.lua
      - .github/workflows/build-korean-extra-settings-icons.yml
      - .github/workflows/validate-native-dbcs.yml
  pull_request:
    paths:
      - Scripts/General/FNT_DBCS.lua
      - Scripts/General/KoreanFont.lua
      - Scripts/General/KoreanFontText.lua
      - Scripts/General/ZZ_KoreanGameplayFeedbackFixes.lua
      - Scripts/General/ZZ_KoreanReportedLocalization.lua
      - Scripts/General/ZZ_KoreanEmeraldWellTimerFix.lua
      - Scripts/General/ZZZ_KoreanExtraSettingsOverlay.lua
      - Scripts/General/ZZZZ_KoreanRuntimeHotfix.lua
      - Data/LocalizeConf.ini
      - "Data/Text localization/KO_*.txt"
      - Data/Text localization/KO_StatsDescriptions.tsv
      - Data/Text localization/MM7History_KO.txt
      - Data/zz LocKO.T.lod
      - Data/zz LocKO.icons.lod
      - DataFiles/DBCS_*.fnt
      - tools/apply_reported_term_fixes.py
      - tools/patch_reported_terms_lod.py
      - tools/patch_static_stats_lod.py
      - tools/validate_native_dbcs_integration.py
      - tools/validate_reported_localization_fixes.py
      - tools/apply_report_65949_fixes.py
      - tools/run_report_65949_source_fixes.py
      - tools/patch_report_65949_lod.py
      - tools/validate_report_65949.py
      - tools/apply_report_65949_followup_fixes.py
      - tools/patch_report_65949_followup_lod.py
      - tools/validate_report_65949_followup.py
      - tools/apply_report_65949_item_review2.py
      - tools/validate_report_65949_item_review2.py
      - tools/apply_report_65949_item_review3.py
      - tools/validate_report_65949_item_review3.py
      - tools/apply_report_65949_item_review4.py
      - tools/validate_report_65949_item_review4.py
      - tools/apply_report_65949_item_review5.py
      - tools/validate_report_65949_item_review5.py
      - tools/build_korean_extra_settings_icons.py
      - tools/test_emerald_well_timer_fix.lua
      - tools/test_korean_extra_settings_overlay.lua
      - tools/test_korean_runtime_hotfix.lua
      - .github/workflows/build-korean-extra-settings-icons.yml
      - .github/workflows/validate-native-dbcs.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate pinned integration
        run: python tools/validate_native_dbcs_integration.py .

      - name: Validate reported localization fixes
        run: python tools/validate_reported_localization_fixes.py .

      - name: Validate report 65949 source-backed QA passes
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_report_65949.py .
          python tools/validate_report_65949_followup.py .
          python tools/validate_report_65949_item_review2.py .
          python tools/validate_report_65949_item_review3.py .
          python tools/validate_report_65949_item_review4.py .
          python tools/validate_report_65949_item_review5.py .

      - name: Validate reported terminology in LOD
        run: |
          python tools/patch_reported_terms_lod.py \
            --lod "Data/zz LocKO.T.lod" \
            --check

      - name: Validate character stats tooltips
        run: |
          python tools/patch_static_stats_lod.py \
            --lod "Data/zz LocKO.T.lod" \
            --translations "Data/Text localization/KO_StatsDescriptions.tsv" \
            --check

      - name: Validate Korean Extra Settings icons archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('Data/zz LocKO.icons.lod')
          if not p.is_file() or p.stat().st_size < 4096:
              raise SystemExit('missing or implausibly small Data/zz LocKO.icons.lod')
          data = p.read_bytes().lower()
          required = [b'exsetscr2', b'exsetscrk', b'extsetdw', b'extsetup']
          missing = [name.decode('ascii') for name in required if name not in data]
          if missing:
              raise SystemExit('Extra Settings icons archive is missing entries: ' + ', '.join(missing))
          print(f'Extra Settings icons archive: OK ({p.stat().st_size} bytes)')
          PY

      - name: Lua 5.1 syntax and runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 >/dev/null
          luac5.1 -p Scripts/General/FNT_DBCS.lua
          luac5.1 -p Scripts/General/KoreanFont.lua
          luac5.1 -p Scripts/General/KoreanFontText.lua
          luac5.1 -p Scripts/General/ZZ_KoreanGameplayFeedbackFixes.lua
          luac5.1 -p Scripts/General/ZZ_KoreanReportedLocalization.lua
          luac5.1 -p Scripts/General/ZZ_KoreanEmeraldWellTimerFix.lua
          luac5.1 -p Scripts/General/ZZZ_KoreanExtraSettingsOverlay.lua
          luac5.1 -p Scripts/General/ZZZZ_KoreanRuntimeHotfix.lua
          luac5.1 -p tools/test_emerald_well_timer_fix.lua
          luac5.1 -p tools/test_korean_extra_settings_overlay.lua
          luac5.1 -p tools/test_korean_runtime_hotfix.lua
          lua5.1 tools/test_emerald_well_timer_fix.lua
          lua5.1 tools/test_korean_extra_settings_overlay.lua
          lua5.1 tools/test_korean_runtime_hotfix.lua

      - name: Upstream MM8 page-font harness
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_REV="aea1b22666ef556f34a71b4f3945904b04de1466"
          git clone --quiet https://github.com/might-and-magic/mm678-i18n.git /tmp/mm678-i18n
          git -C /tmp/mm678-i18n checkout --quiet "$UPSTREAM_REV"
          python -m pip install --quiet lupa
          REPO_ROOT="$GITHUB_WORKSPACE" python - <<'PY'
          import os
          import lupa
          here = '/tmp/mm678-i18n/tools/fnt_dbcs_harness'
          target = os.path.join(os.environ['REPO_ROOT'], 'Scripts', 'General', 'FNT_DBCS.lua')
          os.chdir(here)
          lua = lupa.LuaRuntime()
          lua.globals().SCRIPT_UNDER_TEST = target
          with open(os.path.join(here, 'harness.lua'), 'rb') as f:
              lua.execute(f.read().decode('latin-1'))
          PY
