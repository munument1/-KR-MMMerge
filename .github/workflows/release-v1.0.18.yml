# v1.0.18 release workflow
name: Release v1.0.18

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.0.18.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Korean integration
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_native_dbcs_integration.py .
          python tools/validate_reported_localization_fixes.py .
          python tools/validate_report_65949.py .
          python tools/validate_report_65949_followup.py .
          python tools/validate_report_65949_item_review2.py .
          python tools/validate_report_65949_item_review3.py .
          python tools/validate_report_65949_item_review4.py .
          python tools/validate_report_65949_item_review5.py .
          python tools/validate_report_65960.py .
          python tools/patch_report_65960_lod.py --lod "Data/zz LocKO.T.lod" --check
          python tools/patch_reported_terms_lod.py --lod "Data/zz LocKO.T.lod" --check
          python tools/patch_static_stats_lod.py --lod "Data/zz LocKO.T.lod" --translations "Data/Text localization/KO_StatsDescriptions.tsv" --check

          python - <<'PY'
          from pathlib import Path
          p = Path('Data/zz LocKO.icons.lod')
          if not p.is_file() or p.stat().st_size < 4096:
              raise SystemExit('missing or implausibly small Data/zz LocKO.icons.lod')
          data = p.read_bytes().lower()
          required = [b'exsetscr2', b'exsetscrk', b'extsetdw', b'extsetup']
          missing = [x.decode('ascii') for x in required if x not in data]
          if missing:
              raise SystemExit('missing Extra Settings icon entries: ' + ', '.join(missing))
          print(f'Extra Settings icons archive: OK ({p.stat().st_size} bytes)')
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 >/dev/null
          for f in \
            Scripts/General/FNT_DBCS.lua \
            Scripts/General/KoreanFont.lua \
            Scripts/General/KoreanFontText.lua \
            Scripts/General/KoreanHistory.lua \
            Scripts/General/KoreanStatsAndSkills.lua \
            Scripts/General/ZZ_KoreanGameplayFeedbackFixes.lua \
            Scripts/General/ZZ_KoreanReportedLocalization.lua \
            Scripts/General/ZZ_KoreanEmeraldWellTimerFix.lua \
            Scripts/General/ZZZ_KoreanExtraSettingsOverlay.lua \
            Scripts/General/ZZZZ_KoreanRuntimeHotfix.lua \
            tools/test_emerald_well_timer_fix.lua \
            tools/test_korean_extra_settings_overlay.lua \
            tools/test_korean_runtime_hotfix.lua \
            tools/test_korean_history_all_continents.lua; do
            luac5.1 -p "$f"
          done
          lua5.1 tools/test_emerald_well_timer_fix.lua
          lua5.1 tools/test_korean_extra_settings_overlay.lua
          lua5.1 tools/test_korean_runtime_hotfix.lua
          lua5.1 tools/test_korean_history_all_continents.lua

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v1.0.18"
          ASSET="MMMerge_Korean_${VERSION}_Release.zip"
          rm -rf release-stage
          mkdir -p release-stage

          cp -a Data release-stage/
          cp -a DataFiles release-stage/
          cp -a Scripts release-stage/
          cp mm8lang.ini release-stage/
          cp README.txt release-stage/
          cp CHANGELOG.txt release-stage/
          cp FONT_LICENSES.md release-stage/
          cp STR_TRANSLATION_COVERAGE.txt release-stage/
          cp RUNTIME_LOCALIZATION_AUDIT.txt release-stage/
          cp DBCS_REFACTOR_AUDIT.txt release-stage/
          cp UI_RENDER_CORRUPTION_AUDIT.txt release-stage/
          cp NATIVE_DBCS_MIGRATION_AUDIT.txt release-stage/

          cat > release-stage/RELEASE_v1.0.18.txt <<'EOF'
          MMMerge 한국어 패치 v1.0.18

          사용자 제보 65960 후속 번역/아이템 QA와 v1.0.17b 이후 확인된
          하렉의 가죽 갑옷 효과 설명 정정을 포함합니다.

          주요 수정:
          - 경이의 시대 / 침묵의 시대 등 역사 용어 통일
          - 장님 메코리그 명칭 통일
          - 사격 보너스/피해를 원거리 공격 보너스/원거리 피해로 통일
          - 방패 GM 설명과 아이기스 효과 설명을 실제 Merge 효과에 맞게 정정
          - 제이덤산 / 안타개릭산 보석 산지 표기 통일
          - 하렉의 가죽 갑옷을 실제 Merge 코드 기준으로 정정:
            맨손 기술 +5, 함정 해제 기술 +5, 수중 호흡,
            운 +50, 모든 저항력 -10
          - v1.0.17b의 NEW GAME M&M6/7/8 라벨 및 MM6/7/8 역사 복구 유지
          - Extra Settings 한국어화, 에메랄드 섬 우물 타이머 수정 등 기존 수정 유지

          설치:
          ZIP 전체를 Might and Magic 8 / MMMerge 설치 폴더에 그대로 덮어쓰십시오.
          기존 한국어 패치 위에 전체 덮어쓰기를 권장합니다.
          EOF

          (
            cd release-stage
            find Data DataFiles Scripts -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum mm8lang.ini README.txt CHANGELOG.txt RELEASE_v1.0.18.txt FONT_LICENSES.md \
              STR_TRANSLATION_COVERAGE.txt RUNTIME_LOCALIZATION_AUDIT.txt \
              DBCS_REFACTOR_AUDIT.txt UI_RENDER_CORRUPTION_AUDIT.txt \
              NATIVE_DBCS_MIGRATION_AUDIT.txt >> SHA256SUMS.txt
            zip -9 -X -r "../${ASSET}" .
          )

          ZIP_SHA="$(sha256sum "${ASSET}" | awk '{print $1}')"
          printf '%s  %s\n' "${ZIP_SHA}" "${ASSET}" > "${ASSET}.sha256"

          cat > release-notes.md <<'EOF'
          ## MMMerge 한국어 패치 v1.0.18

          사용자 제보 **65960 후속 번역/아이템 QA**와 v1.0.17b 이후 확인된 효과 설명 정정을 반영한 정식 릴리즈입니다.

          ### 번역 / 아이템 QA
          - `the Time of Wonders` → **경이의 시대**, `Silence` → **침묵의 시대**로 통일
          - Mekorig the Blind 관련 표기를 **장님 메코리그**로 통일
          - `사격 보너스 / 사격 피해` → **원거리 공격 보너스 / 원거리 피해**
          - 방패 그랜드마스터 설명을 **방패 주문 효과 자동 부여**로 정정
          - 아이기스 효과 설명을 실제 Merge 코드에 맞게 정정
          - 제이덤/안타개릭 보석 산지 표기를 **제이덤산 / 안타개릭산**으로 정리
          - 기타 제보 65960의 아티팩트·성유물·용어 교정 반영

          ### 하렉의 가죽 갑옷
          Merge의 `ExtraArtifacts.lua` 실제 효과를 다시 대조해 다음과 같이 정정했습니다.
          - **맨손 기술 +5**
          - **함정 해제 기술 +5**
          - **수중 호흡**
          - **운 +50**
          - **모든 저항력 -10**

          기존의 `훔치기 기술 +5` 표기는 잘못된 번역이었습니다.

          ### 기존 수정 유지
          - NEW GAME에서 M&M6 / M&M7 / M&M8 라벨 표시
          - MM6 / MM7 / MM8 역사 기록 한국어 재적용
          - Extra Settings 한국어 이미지 및 런타임 텍스트
          - 에메랄드 섬 우물 저장/불러오기 타이머 호환성 수정
          - `mm8lang.ini` 런타임 한국어 문자열
          - 사용자 제보 65949 전체 QA 수정

          ### 검증
          - native DBCS 통합 검사
          - 제보 65949 / 65960 회귀 검사
          - 정적 LOD 및 능력치 툴팁 검사
          - Extra Settings 아이콘 LOD 검사
          - Lua 5.1 문법/런타임 회귀 검사
          - MM6/7/8 역사 및 NEW GAME 회귀 검사

          ### 설치
          ZIP 전체 내용을 Might and Magic 8 / MMMerge 설치 폴더에 덮어쓰십시오. 기존 한국어 패치 위에 **전체 덮어쓰기**를 권장합니다.
          EOF

          printf '\nZIP SHA-256:\n\n%s\n' "$ZIP_SHA" >> release-notes.md
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.18"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
            gh release edit "$TAG" --title "MMMerge 한국어 패치 v1.0.18" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" --target "$GITHUB_SHA" --title "MMMerge 한국어 패치 v1.0.18" --notes-file release-notes.md --latest
          fi
