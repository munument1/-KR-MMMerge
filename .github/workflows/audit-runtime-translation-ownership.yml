name: Audit runtime translation ownership

on:
  workflow_dispatch:
  push:
    branches:
      - po-localization-bootstrap
    paths:
      - Data/Text localization/**
      - Scripts/**/*.lua
      - tools/audit_runtime_translation_ownership.py
      - .github/workflows/audit-runtime-translation-ownership.yml
  pull_request:
    paths:
      - Data/Text localization/**
      - Scripts/**/*.lua
      - tools/audit_runtime_translation_ownership.py
      - .github/workflows/audit-runtime-translation-ownership.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit static vs runtime ownership
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_runtime_translation_ownership.py \
            --json build/RUNTIME_TRANSLATION_OWNERSHIP.json

      - name: Add report to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f build/RUNTIME_TRANSLATION_OWNERSHIP.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path('build/RUNTIME_TRANSLATION_OWNERSHIP.json').read_text(encoding='utf-8'))
          print('## Runtime translation ownership')
          print()
          print(f"- Runtime override records: **{r['runtime_override_records']}**")
          print(f"- Override keys also present in other Korean tables: **{r['runtime_override_duplicate_keys']}**")
          print(f"- Runtime-only override keys: **{r['runtime_override_unique_keys']}**")
          print(f"- Hard-coded Lua literal maps overlapping static data: **{r['lua_literal_maps_with_static_overlap']}**")
          print()
          print('This audit is informational during PO migration; known runtime exceptions are not failures yet.')
          PY
          fi
