name: Migrate mm8lang into PO canonical ownership v2

on:
  push:
    branches:
      - i18n-mm8lang-po
    paths:
      - .github/workflows/migrate-mm8lang-po-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      MM678_I18N_REV: aea1b22666ef556f34a71b4f3945904b04de1466
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check polib

      - name: Fetch pinned English source and patch PO routing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/mm8lang-source
          curl -fsSL \
            "https://raw.githubusercontent.com/might-and-magic/mm678-i18n/${MM678_I18N_REV}/source/en/mm8/mm8lang.ini" \
            -o build/mm8lang-source/mm8lang.ini
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/build_korean_from_po.py')
          text = path.read_text(encoding='utf-8')
          old = '''        target = parse_target_from_comment(entry)\n        if target is None:\n            unexpected.append(f"{context}: no KO target comment")\n            continue\n'''
          new = '''        target = parse_target_from_comment(entry)\n        if target is None:\n            if "KO-ROOT: " in (entry.comment or ""):\n                continue\n            unexpected.append(f"{context}: no KO target comment")\n            continue\n'''
          if old not in text:
              raise SystemExit('load_catalog target block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')
          PY

      - name: Import and round-trip mm8lang through PO
        shell: bash
        run: |
          set -euo pipefail
          python tools/augment_po_mm8lang.py \
            --korean mm8lang.ini \
            --english build/mm8lang-source/mm8lang.ini \
            --po translations/ko/mmmerge.po \
            --report translations/ko/PO_BOOTSTRAP_REPORT.json
          python tools/build_korean_from_po.py --write
          python tools/build_mm8lang_from_po.py --write
          rm -rf build/mm8lang-data-roundtrip
          python tools/build_korean_from_po.py \
            --output-root build/mm8lang-data-roundtrip \
            --require-byte-identical
          python tools/build_mm8lang_from_po.py \
            --output build/mm8lang-roundtrip.ini \
            --require-byte-identical

      - name: Refresh baseline and verify coverage
        shell: bash
        run: |
          set -euo pipefail
          python tools/po_catalog_stats.py \
            translations/ko/mmmerge.po \
            --json translations/ko/PO_BASELINE.json \
            --min-translated 25051 \
            --fail-fuzzy \
            --source-revision "$MM678_I18N_REV"
          python tools/rebuild_runtime_overrides.py --check
          python tools/rebuild_stats_skills_runtime.py --check
          python tools/audit_runtime_translation_ownership.py --json build/RUNTIME_TRANSLATION_OWNERSHIP.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('translations/ko/PO_BOOTSTRAP_REPORT.json').read_text(encoding='utf-8'))
          assert report['entries'] == 25051, report['entries']
          assert report['translated'] == 25051, report['translated']
          assert report['untranslated'] == 0, report['untranslated']
          assert report['root_files']['mm8lang.ini']['entries'] == 17
          ownership = json.loads(Path('build/RUNTIME_TRANSLATION_OWNERSHIP.json').read_text(encoding='utf-8'))
          assert ownership['runtime_override_unique_keys'] == 0
          print('25,051-entry PO and zero runtime-only overrides: OK')
          PY

      - name: Prove duplicate mm8lang source is semantically identical, then remove it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from tools.augment_po_mm8lang import decode_text, read_settings
          old = Path('Data/Text localization/KO_mm8lang.ini.utf8')
          runtime = Path('mm8lang.ini')
          old_text, old_encoding = decode_text(old)
          runtime_text, runtime_encoding = decode_text(runtime)
          print('KO_mm8lang encoding:', old_encoding)
          print('runtime mm8lang encoding:', runtime_encoding)
          if read_settings(old) != read_settings(runtime):
              raise SystemExit('KO_mm8lang and runtime mm8lang differ semantically')
          print('mm8lang semantic values: identical')
          PY
          git rm 'Data/Text localization/KO_mm8lang.ini.utf8'

      - name: Refresh PO workflow documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/PO_WORKFLOW.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '활성 항목: **25,034**': '활성 항목: **25,051**',
              '번역 완료: **25,034 / 25,034 (100%)**': '번역 완료: **25,051 / 25,051 (100%)**',
              '- PO가 관리하는 canonical Korean 파일: **30개**\n': '- PO가 관리하는 canonical Korean 텍스트 테이블: **30개**\n- PO가 관리하는 root runtime INI: `mm8lang.ini` (**17개 문자열**)\n',
              '   - PO -> 30개 canonical `KO_*` 파일 materialize\n': '   - PO -> 30개 canonical `KO_*` 파일 materialize\n   - PO -> root `mm8lang.ini` materialize\n',
              '현재 PO는 30개 canonical 파일을 **바이트 단위로 그대로 재생성**할 수 있음이\n': '현재 PO는 30개 canonical KO 파일과 root `mm8lang.ini`를 **바이트 단위로 그대로 재생성**할 수 있음이\n',
              'python tools/build_korean_from_po.py --write\npython tools/rebuild_runtime_overrides.py --write\n': 'python tools/build_korean_from_po.py --write\npython tools/build_mm8lang_from_po.py --write\npython tools/rebuild_runtime_overrides.py --write\n',
              'MM6/MM7/MM8 역사 파일은 현재 PO 25,034개 카탈로그와 별도로 관리한다.': 'MM6/MM7/MM8 역사 파일은 현재 PO 25,051개 카탈로그와 별도로 관리한다.',
              '  - 25,034개 coverage 기준\n': '  - 25,051개 coverage 기준\n',
              'canonical KO text tables\n        ↓\nRuntimeOverrides / StatsSkillsRuntime\n': 'canonical KO text tables + mm8lang.ini\n        ↓\nRuntimeOverrides / StatsSkillsRuntime\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'documentation text not found: {old!r}')
              text = text.replace(old, new, 1)
          marker = '## RuntimeOverride 소유권\n'
          section = '''## mm8lang.ini 소유권\n\nGrayFace/MM8 런타임 메시지 17개도 PO에서 관리한다. 영어 원문은 pinned\n`source/en/mm8/mm8lang.ini`에서 가져오며, 한국어 `msgstr`은 이 저장소의 기존\n`mm8lang.ini`를 이식한 것이다. `tools/build_mm8lang_from_po.py`는 현재 런타임\n파일의 native 인코딩(CP949)을 보존하면서 배포 루트 `mm8lang.ini`를 생성한다.\n\n기존 UTF-8 편집 사본 `Data/Text localization/KO_mm8lang.ini.utf8`은 같은 키/값임을\n검증한 뒤 제거했다. 이제 이 문자열의 편집 원본도 PO 하나뿐이다.\n\n'''
          if marker not in text:
              raise SystemExit('RuntimeOverride marker not found')
          path.write_text(text.replace(marker, section + marker, 1), encoding='utf-8', newline='')
          PY
          git diff --check

      - name: Commit migration data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            translations/ko/mmmerge.po \
            translations/ko/PO_BASELINE.json \
            translations/ko/PO_BOOTSTRAP_REPORT.json \
            tools/build_korean_from_po.py \
            mm8lang.ini \
            docs/PO_WORKFLOW.md
          git commit -m 'refactor(i18n): move mm8lang runtime strings into PO'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
