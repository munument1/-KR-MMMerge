name: Apply report 65960 fixes

on:
  push:
    branches: [main]
    paths:
      - tools/apply_report_65960_fixes.py
      - tools/validate_report_65960.py
      - tools/patch_report_65960_lod.py
      - tools/validate_report_65949.py
      - tools/apply_report_65949_item_review4.py
      - .github/workflows/apply-report-65960-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply report 65960 source corrections
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_report_65960_fixes.py .

      - name: Propagate Global and SPCITEMS corrections into Korean LOD
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_report_65960_lod.py \
            --lod "Data/zz LocKO.T.lod" \
            --output /tmp/LocKO-report65960.lod
          mv /tmp/LocKO-report65960.lod "Data/zz LocKO.T.lod"

      - name: Validate report 65960 corrections
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_report_65960.py .
          python tools/patch_report_65960_lod.py --lod "Data/zz LocKO.T.lod" --check
          python tools/validate_reported_localization_fixes.py .
          python tools/validate_report_65949.py .
          python tools/validate_report_65949_followup.py .
          python tools/validate_report_65949_item_review2.py .
          python tools/validate_report_65949_item_review3.py .
          python tools/validate_report_65949_item_review4.py .
          python tools/validate_report_65949_item_review5.py .
          python tools/patch_reported_terms_lod.py --lod "Data/zz LocKO.T.lod" --check
          python tools/patch_static_stats_lod.py \
            --lod "Data/zz LocKO.T.lod" \
            --translations "Data/Text localization/KO_StatsDescriptions.tsv" \
            --check

          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 >/dev/null
          luac5.1 -p Scripts/General/KoreanStatsAndSkills.lua

      - name: Commit source and LOD updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "Data/Text localization" "Data/zz LocKO.T.lod" Scripts/General/KoreanStatsAndSkills.lua; then
            echo "Report 65960 corrections are already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Data/Text localization" "Data/zz LocKO.T.lod" Scripts/General/KoreanStatsAndSkills.lua
          git commit -m "fix(korean): apply report 65960 QA pass"
          git push
