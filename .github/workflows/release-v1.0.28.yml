# v1.0.28 one-shot release workflow.
# Bundles the v1.0.27 NPC follower fixes with the bounded StatsDescriptions fix
# and the current Korean cutscene subtitle runtime.
name: Release v1.0.28

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.0.28.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check polib
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 >/dev/null

      - name: Validate canonical Korean runtime
        shell: bash
        run: |
          set -euo pipefail
          python tools/po_catalog_stats.py \
            translations/ko/mmmerge.po \
            --baseline translations/ko/PO_BASELINE.json \
            --no-regress --fail-fuzzy --min-translated 25051
          rm -rf build/po-release-roundtrip
          python tools/build_korean_from_po.py \
            --output-root build/po-release-roundtrip \
            --require-byte-identical
          python tools/build_mm8lang_from_po.py \
            --output build/mm8lang-release-roundtrip.ini \
            --require-byte-identical
          python tools/rebuild_runtime_overrides.py --check
          python tools/rebuild_stats_skills_runtime.py --check
          python tools/audit_runtime_translation_ownership.py --json build/runtime-ownership-release.json
          python tools/audit_lua_korean_literals.py --json build/lua-korean-literals-release.json

      - name: Validate stats, followers, subtitles, and DBCS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('Data/Text localization/KO_StatsSkillsRuntime.txt')
          text = p.read_bytes().decode('euc_kr')
          current = ''
          ids = []
          for line in text.splitlines()[1:]:
              parts = line.split('\t', 3)
              if len(parts) < 4:
                  continue
              if parts[0]:
                  current = parts[0]
              if current == 'StatsDescriptions' and parts[1].isdigit():
                  ids.append(int(parts[1]))
          assert ids == list(range(7)), ids
          print('StatsDescriptions runtime bounds: 0..6 OK')
          PY

          python tools/validate_native_dbcs_integration.py .
          python tools/validate_rodril_overlay_boundary.py
          python tools/audit_rodril_localizer_semantics.py
          python tools/audit_rodril_follower_topic_aliases.py
          python tools/validate_korean_history_encoding.py
          python tools/validate_reported_localization_fixes.py .
          python tools/patch_static_stats_lod.py \
            --lod "Data/zz LocKO.T.lod" \
            --translations "Data/Text localization/KO_StatsDescriptions.tsv" \
            --check
          python tools/validate_korean_movie_subtitles.py .

          for f in \
            Scripts/General/FNT_DBCS.lua \
            Scripts/General/KoreanMovieSubtitles.lua \
            Scripts/General/LocalizeTables.lua \
            Scripts/General/ZZ_KoreanRodrilNumericLocalization.lua \
            tools/test_localize_tables_upstream_semantics.lua \
            tools/test_korean_movie_subtitles.lua \
            tools/test_korean_rodril_numeric_localization.lua; do
            luac5.1 -p "$f"
          done
          lua5.1 tools/test_localize_tables_upstream_semantics.lua
          lua5.1 tools/test_korean_movie_subtitles.lua
          lua5.1 tools/test_korean_rodril_numeric_localization.lua

      - name: Build clean release package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v1.0.28"
          ASSET="MMMerge_Korean_${VERSION}_Release.zip"
          rm -rf release-stage
          mkdir -p release-stage
          cp -a Data release-stage/
          cp -a DataFiles release-stage/
          cp -a Scripts release-stage/
          cp mm8lang.ini release-stage/
          cp FONT_LICENSES.md release-stage/

          cat > release-stage/README.txt <<'EOF'
          MMMerge 한국어 패치 v1.0.28

          설치:
          1) Rodril MMMerge를 먼저 설치합니다.
          2) 이 ZIP의 내용을 게임 폴더에 그대로 덮어씁니다.
          3) 게임을 완전히 종료했다가 다시 실행합니다.

          v1.0.20~v1.0.27 사용자는 그대로 덮어쓰면 됩니다.
          v1.0.19 이하 사용자는 Rodril MMMerge 원본을 먼저 다시 적용한 뒤 설치하십시오.

          v1.0.28 핵심 변경:
          - Stats 화면 경험치 클릭 CTD 관련 잘못된 StatsDescriptions 7..25 런타임 투영 제거
          - Game.StatsDescriptions 런타임 범위를 0..6으로 제한
          - stats.txt의 26개 한국어 도움말/정적 LOD 번역은 유지
          - v1.0.27 NPC follower 고용/해고 및 반완료 고용 복구 유지
          - MMMerge 대화 컷신 19종 한국어 SRT 자막 포함

          저장소: https://github.com/munument1/-KR-MMMerge
          EOF

          forbidden=(
            CHANGELOG.txt STR_TRANSLATION_COVERAGE.txt RUNTIME_LOCALIZATION_AUDIT.txt
            DBCS_REFACTOR_AUDIT.txt UI_RENDER_CORRUPTION_AUDIT.txt NATIVE_DBCS_MIGRATION_AUDIT.txt
            UPSTREAM_BASELINE.md MIGRATION_v1.0.20.txt SHA256SUMS.txt
          )
          for f in "${forbidden[@]}"; do
            test ! -e "release-stage/$f"
          done

          test ! -f release-stage/Scripts/Maps/out01.lua
          test -f release-stage/Scripts/General/LocalizeTables.lua
          test -f release-stage/Scripts/General/ZZ_KoreanRodrilNumericLocalization.lua
          test -f release-stage/Scripts/General/KoreanMovieSubtitles.lua
          test -d "release-stage/Data/Korean Subtitles"
          test "$(find 'release-stage/Data/Korean Subtitles' -type f -name '*.srt' | wc -l)" -eq 19
          grep -q 'SyncNPCJoinPermissions' release-stage/Scripts/General/ZZ_KoreanRodrilNumericLocalization.lua
          grep -q 'InstallHireAddGuard' release-stage/Scripts/General/ZZ_KoreanRodrilNumericLocalization.lua
          grep -q 'InstallFollowerTopicAliases' release-stage/Scripts/General/ZZ_KoreanRodrilNumericLocalization.lua
          grep -q '_G.DismissNPCTopic = dismiss' release-stage/Scripts/General/ZZ_KoreanRodrilNumericLocalization.lua
          grep -q 'npcHasEvent(npc, hireTopic)' release-stage/Scripts/General/ZZ_KoreanRodrilNumericLocalization.lua
          ! grep -q 'ReapplyRodrilNumericLocalization' release-stage/Scripts/General/ZZ_KoreanRodrilNumericLocalization.lua

          python - <<'PY'
          from pathlib import Path
          text = Path('release-stage/Data/Text localization/KO_StatsSkillsRuntime.txt').read_bytes().decode('euc_kr')
          current = ''
          ids = []
          for line in text.splitlines()[1:]:
              p = line.split('\t', 3)
              if len(p) < 4:
                  continue
              if p[0]:
                  current = p[0]
              if current == 'StatsDescriptions' and p[1].isdigit():
                  ids.append(int(p[1]))
          assert ids == list(range(7)), ids
          print('packaged StatsDescriptions runtime bounds: 0..6 OK')
          PY

          (
            cd release-stage
            zip -9 -X -r "../${ASSET}" .
          )
          ZIP_SHA="$(sha256sum "${ASSET}" | awk '{print $1}')"
          printf '%s  %s\n' "${ZIP_SHA}" "${ASSET}" > "${ASSET}.sha256"

          cat > release-notes.md <<'EOF'
          ## MMMerge 한국어 패치 v1.0.28

          v1.0.27의 NPC follower 고용 호환 수정에 더해, Stats 화면에서 경험치를 클릭할 때 발생하는 CTD의 한국어 패치 측 런타임 범위 오류를 수정합니다.

          ### Stats 경험치 클릭 CTD
          - `Game.StatsDescriptions`는 MMExtension에서 7개 기본 능력치(0..6) 배열입니다.
          - v1.0.19 이후 생성기가 26개 `stats.txt` 도움말 전체를 이 런타임 배열에 투영하던 오류를 수정했습니다.
          - 런타임 투영은 0..6으로 제한했습니다.
          - 경험치/레벨 등을 포함한 26개 한국어 도움말은 정적 `zz LocKO.T.lod`에 그대로 유지됩니다.

          ### NPC follower
          v1.0.27의 수정이 그대로 포함됩니다.
          - Rodril bare `HireNPCTopic` / `DismissNPCTopic` 후처리 참조 호환
          - follower 목록/Hired가 반쯤 적용된 고용 상태 복구
          - 정상 신규/정상 중복/unrelated Add 오류 의미 유지

          ### 컷신 자막
          - MM6 3종 / MM7 10종 / MM8 6종, 총 19개 대화 컷신 한국어 SRT 자막 포함
          - 원본 영상은 재인코딩하지 않고 런타임에서 자막을 표시합니다.

          ### 검증
          - canonical PO 및 PO round-trip
          - StatsDescriptions runtime ids 0..6
          - 정적 stats.txt 26행 한국어 도움말
          - Rodril LocalizeTables/follower 회귀
          - native DBCS 및 컷신 자막 19파일/177 cue 검사

          ### 설치
          - v1.0.20~v1.0.27: ZIP 내용을 그대로 덮어쓴 뒤 게임을 완전히 종료/재실행하십시오.
          - v1.0.19 이하: Rodril MMMerge 원본을 먼저 재적용한 뒤 설치하십시오.

          NPC 고용과 경험치 클릭 문제는 실제 플레이 환경에서 최종 확인해 주세요.
          EOF
          printf '\nZIP SHA-256:\n\n%s\n' "$ZIP_SHA" >> release-notes.md
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.28"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
            --target "$GITHUB_SHA" \
            --title "MMMerge 한국어 패치 v1.0.28" \
            --notes-file release-notes.md \
            --latest
