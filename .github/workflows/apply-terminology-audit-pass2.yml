name: Apply terminology audit pass 2

on:
  push:
    branches:
      - fix/terminology-audit-pass2
    paths:
      - tools/apply_terminology_audit_pass2.py
      - .github/workflows/apply-terminology-audit-pass2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PO dependency
        run: python -m pip install --disable-pip-version-check polib

      - name: Apply scoped terminology fixes
        run: python tools/apply_terminology_audit_pass2.py .

      - name: Require complete reviewed PO
        run: |
          python tools/po_catalog_stats.py \
            translations/ko/mmmerge.po \
            --baseline translations/ko/PO_BASELINE.json \
            --no-regress \
            --fail-fuzzy \
            --min-translated 25051

      - name: Materialize Korean runtime sources
        run: |
          python tools/build_korean_from_po.py --write
          python tools/build_mm8lang_from_po.py --write
          python tools/rebuild_runtime_overrides.py --write
          python tools/rebuild_runtime_overrides.py --check
          python tools/rebuild_stats_skills_runtime.py --write
          python tools/rebuild_stats_skills_runtime.py --check

      - name: Validate localization
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_parser_sensitive_localization.py
          mkdir -p build
          python tools/audit_runtime_translation_ownership.py \
            --json build/RUNTIME_TRANSLATION_OWNERSHIP.json
          python tools/audit_lua_korean_literals.py \
            --json build/LUA_KOREAN_LITERAL_AUDIT.json
          rm -rf build/po-sync-check
          python tools/build_korean_from_po.py \
            --output-root build/po-sync-check \
            --require-byte-identical
          python tools/build_mm8lang_from_po.py \
            --output build/mm8lang-sync-check.ini \
            --require-byte-identical

      - name: Commit synchronized terminology changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- translations/ko/mmmerge.po 'Data/Text localization' mm8lang.ini)" ]]; then
            echo "Terminology audit pass 2 is already synchronized."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/ko/mmmerge.po 'Data/Text localization' mm8lang.ini
          git commit -m 'build(i18n): sync terminology audit pass 2'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
