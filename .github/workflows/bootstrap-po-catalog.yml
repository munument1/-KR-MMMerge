name: Bootstrap Korean gettext catalog

on:
  workflow_dispatch:
  push:
    branches:
      - po-localization-bootstrap
    paths:
      - 'Data/Text localization/**'
      - config/runtime_override_keys.tsv
      - .github/workflows/bootstrap-po-catalog.yml
      - tools/bootstrap_po_from_utf8.py
      - tools/augment_po_special_sources.py
      - tools/augment_po_skilldes_source.py
      - tools/po_catalog_stats.py
      - tools/rebuild_runtime_overrides.py
      - tools/rebuild_stats_skills_runtime.py

permissions:
  contents: write

concurrency:
  group: bootstrap-ko-po-${{ github.ref }}
  cancel-in-progress: false

env:
  MM678_I18N_REV: aea1b22666ef556f34a71b4f3945904b04de1466

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean patch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bootstrap dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check polib

      - name: Clone pinned English source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/might-and-magic/mm678-i18n.git vendor/mm678-i18n
          git -C vendor/mm678-i18n checkout --detach "$MM678_I18N_REV"

      - name: Normalize mixed Korean source encodings to UTF-8
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('Data/Text localization')
          target = Path('build/po-korean-source')
          target.mkdir(parents=True, exist_ok=True)
          counts = {'utf-8': 0, 'cp949': 0, 'skipped_generated_or_special': 0}
          skip = {'KO_Skilldes.txt', 'KO_StatsSkillsRuntime.txt'}
          for path in source.iterdir():
              if not path.is_file():
                  continue
              if path.name in skip:
                  counts['skipped_generated_or_special'] += 1
                  continue
              data = path.read_bytes()
              try:
                  text = data.decode('utf-8-sig')
                  encoding = 'utf-8'
              except UnicodeDecodeError:
                  text = data.decode('cp949')
                  encoding = 'cp949'
              counts[encoding] += 1
              (target / path.name).write_text(text, encoding='utf-8', newline='')
          print('normalized Korean source files:', counts)
          PY

      - name: Add positional ids to ordered source tables
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import io
          from pathlib import Path

          english = Path('vendor/mm678-i18n/source/en/mmmerge/Data/Text localization')
          korean = Path('build/po-korean-source')

          def read(path):
              data = path.read_bytes()
              try:
                  text = data.decode('utf-8-sig')
              except UnicodeDecodeError:
                  text = data.decode('cp1252')
              return list(csv.reader(io.StringIO(text, newline=''), delimiter='\t', quotechar='"', doublequote=True))

          def write(path, rows):
              out = io.StringIO(newline='')
              writer = csv.writer(out, delimiter='\t', quotechar='"', doublequote=True, lineterminator='\n')
              writer.writerows(rows)
              path.write_text(out.getvalue(), encoding='utf-8', newline='')

          converted = []
          for en_path in sorted(english.glob('LANG_*.txt')):
              ko_path = korean / ('KO_' + en_path.name[5:])
              if not ko_path.is_file():
                  continue
              en_rows = read(en_path)
              ko_rows = read(ko_path)
              if not en_rows or not ko_rows:
                  continue
              head = [x.strip().casefold() for x in en_rows[0]]
              is_long = len(head) >= 4 and head[:4] == ['table (of game struct)', 'id', 'field', 'new text']
              has_id = bool(head) and head[0] in {'id', '#', '2d#', '__rowid'}
              if is_long or has_id:
                  continue
              en_rows = [['__RowId', *en_rows[0]]] + [[str(i), *row] for i, row in enumerate(en_rows[1:])]
              ko_rows = [['__RowId', *ko_rows[0]]] + [[str(i), *row] for i, row in enumerate(ko_rows[1:])]
              write(en_path, en_rows)
              write(ko_path, ko_rows)
              converted.append(en_path.name)
          print('ordered tables given positional ids:', converted)
          PY

      - name: Build PO from English source and this patch's Korean text
        id: build_po
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p translations/ko
          python tools/bootstrap_po_from_utf8.py \
            --korean-dir "build/po-korean-source" \
            --english-root "vendor/mm678-i18n/source/en/mmmerge" \
            --output "translations/ko/mmmerge.po" \
            --report "translations/ko/PO_BOOTSTRAP_REPORT.json" \
            --source-revision "$MM678_I18N_REV"
          python tools/augment_po_special_sources.py \
            --korean-dir "build/po-korean-source" \
            --english-en-root "vendor/mm678-i18n/source/en" \
            --po "translations/ko/mmmerge.po" \
            --report "translations/ko/PO_BOOTSTRAP_REPORT.json"
          python tools/augment_po_skilldes_source.py \
            --korean "Data/Text localization/KO_Skilldes.txt" \
            --english "vendor/mm678-i18n/source/en/mm8/Data/10LocLANG.EnglishT/Skilldes.txt" \
            --po "translations/ko/mmmerge.po" \
            --report "translations/ko/PO_BOOTSTRAP_REPORT.json"

      - name: Refresh generated runtime projections
        if: steps.build_po.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python tools/rebuild_runtime_overrides.py --write
          python tools/rebuild_runtime_overrides.py --check
          python tools/rebuild_stats_skills_runtime.py --write
          python tools/rebuild_stats_skills_runtime.py --check

      - name: Audit regenerated ownership
        if: steps.build_po.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_runtime_translation_ownership.py \
            --json build/RUNTIME_TRANSLATION_OWNERSHIP.json
          python tools/audit_lua_korean_literals.py \
            --json build/LUA_KOREAN_LITERAL_AUDIT.json
          python - <<'PY'
          import json
          from pathlib import Path

          ownership = json.loads(Path('build/RUNTIME_TRANSLATION_OWNERSHIP.json').read_text(encoding='utf-8'))
          bad_runtime = [x for x in ownership['runtime_override_duplicates'] if not x.get('same_text')]
          if bad_runtime:
              sample = [f"{x['table']}[{x['id']}] {x['field'] or '<default>'}" for x in bad_runtime[:10]]
              raise SystemExit(f'canonical-backed runtime wording drift: {sample}')
          if ownership['lua_literal_maps_with_static_overlap'] != 0:
              raise SystemExit('hard-coded Lua translation maps overlap canonical static data')

          literals = json.loads(Path('build/LUA_KOREAN_LITERAL_AUDIT.json').read_text(encoding='utf-8'))
          allowed_runtime_ui = {
              'Scripts/General/ZZ_KoreanReportedLocalization.lua',
              'Scripts/General/ZZZ_KoreanExtraSettingsOverlay.lua',
          }
          unexpected = set(literals['scripts']) - allowed_runtime_ui
          if unexpected:
              raise SystemExit(f'Korean literals appeared in non-runtime-UI Lua files: {sorted(unexpected)}')
          if literals['exact_static_duplicate_occurrences'] != 0:
              raise SystemExit(
                  f"Lua contains {literals['exact_static_duplicate_occurrences']} exact duplicates of canonical Korean data"
              )
          print('regenerated ownership policy: OK')
          PY

      - name: Print pairing diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f translations/ko/PO_BOOTSTRAP_REPORT.json ]]; then
            echo "PO bootstrap report was not created."
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('translations/ko/PO_BOOTSTRAP_REPORT.json').read_text(encoding='utf-8'))
          print('\nPer-file pairing diagnostics:')
          for name, details in sorted(report['files'].items(), key=lambda item: item[0].casefold()):
              missing = len(details.get('missing_korean', []))
              ko_only = len(details.get('korean_only', []))
              source_miss = len(details.get('missing_files', [])) + len(details.get('missing_indexes', []))
              if missing or ko_only or source_miss:
                  print(f"  {name}: missing_ko={missing}, ko_only={ko_only}, source_miss={source_miss}, entries={details.get('entries', details.get('mapped', 0))}")
                  if missing:
                      print('    first missing:', details['missing_korean'][:5])
                  if ko_only:
                      print('    first ko-only:', details['korean_only'][:5])
          print('unmapped Korean files:', report.get('unmapped_korean_files', []))
          print('generated Korean files:', report.get('generated_korean_files', []))
          print('source-only files:', report.get('source_only_files', []))
          PY

      - name: Stop on unsafe bootstrap
        if: steps.build_po.outcome != 'success'
        shell: bash
        run: |
          echo "PO bootstrap safety check failed; diagnostics are printed above."
          exit 1

      - name: Record completeness baseline
        if: steps.build_po.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python tools/po_catalog_stats.py \
            translations/ko/mmmerge.po \
            --json translations/ko/PO_BASELINE.json \
            --min-translated 5000 \
            --source-revision "$MM678_I18N_REV"

      - name: Commit generated PO, reports, and runtime projections
        if: steps.build_po.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            'translations/ko/mmmerge.po'
            'translations/ko/PO_BASELINE.json'
            'translations/ko/PO_BOOTSTRAP_REPORT.json'
            'Data/Text localization/KO_RuntimeOverrides.txt'
            'Data/Text localization/KO_StatsSkillsRuntime.txt'
          )
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo "Catalog and runtime projections are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "build(i18n): refresh Korean catalog and runtime projections"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
