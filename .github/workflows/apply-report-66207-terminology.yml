name: Apply report 66207 terminology

on:
  push:
    branches:
      - fix/report-66207-terminology
    paths:
      - tools/apply_report_66207_terminology.py
      - .github/workflows/apply-report-66207-terminology.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped terminology fixes
        run: python tools/apply_report_66207_terminology.py .

      - name: Commit canonical PO changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- translations/ko/mmmerge.po; then
            echo "Report 66207 terminology changes are already applied."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/ko/mmmerge.po
          git commit -m 'fix(i18n): normalize terminology from report 66207'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
