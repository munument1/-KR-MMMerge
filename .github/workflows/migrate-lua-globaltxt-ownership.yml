name: Migrate Lua GlobalTxt ownership

on:
  workflow_dispatch:
  push:
    branches:
      - po-localization-bootstrap
    paths:
      - tools/migrate_lua_globaltxt_ownership.py
      - .github/workflows/migrate-lua-globaltxt-ownership.yml

permissions:
  contents: write

concurrency:
  group: migrate-lua-globaltxt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Move GlobalTxt late-reapply ownership out of Lua
        shell: bash
        run: |
          set -euo pipefail
          python tools/migrate_lua_globaltxt_ownership.py
          python tools/rebuild_runtime_overrides.py --write
          python tools/rebuild_runtime_overrides.py --check

      - name: Verify hard-coded GlobalTxt maps are gone
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'local globalTxts' Scripts/General/KoreanStatsAndSkills.lua; then
            echo 'KoreanStatsAndSkills.lua still owns GlobalTxt wording.' >&2
            exit 1
          fi
          if grep -qE 'EXPERIENCE_TEXT|applyExperienceTextSafety' Scripts/General/ZZ_KoreanReportedLocalization.lua; then
            echo 'ZZ_KoreanReportedLocalization.lua still owns experience GlobalTxt wording.' >&2
            exit 1
          fi

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            config/runtime_override_keys.tsv
            'Data/Text localization/KO_RuntimeOverrides.txt'
            Scripts/General/KoreanStatsAndSkills.lua
            Scripts/General/ZZ_KoreanReportedLocalization.lua
          )
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo 'GlobalTxt Lua ownership is already migrated.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m 'refactor(i18n): move GlobalTxt wording out of runtime Lua'
          git push origin "HEAD:${GITHUB_REF_NAME}"
