name: Apply report 66003 hotfixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hotfix-report-66003.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch reported regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # 1) MM6/MM7 movie crash: native frame drawing is only safe for MM8 movies.
          path = Path('Scripts/General/KoreanMovieSubtitles.lua')
          text = path.read_text(encoding='utf-8')
          assert 'KMS.Version = "1.1"' in text
          text = text.replace('KMS.Version = "1.1"', 'KMS.Version = "1.2"', 1)

          marker = '''local NATIVE_MOVIE_DRAW_CALLS = {
              0x4BC9C7, -- Bink draw call (next instruction: 0x4BC9CC)
              0x4BCBE6  -- Smacker draw call (next instruction: 0x4BCBEB)
          }
          '''
          assert marker in text
          text = text.replace(marker, marker + '''
          -- Real-game testing of the first v1.1 hotfix showed that drawing CustomUI
          -- from these native frame callbacks crashes the MM6 and MM7 intro movies.
          -- Keep native drawing strictly to MM8 movie stems. Older-continent movies
          -- retain the normal PostRender fallback until a surface-safe path is found.
          local NATIVE_SAFE_STEMS = {
              dragonhunters = true,
              confluxkey = true,
              dragonsrevenge = true,
              overrept = true,
              skeltrans = true,
              wingame = true
          }
          ''', 1)

          marker2 = '''local function installNativeMovieFrameHooks()
          '''
          assert marker2 in text
          native_fn = '''local function drawNativeSubtitleFrame()
              if not active or not NATIVE_SAFE_STEMS[active.Stem] then
                  return false
              end
              return drawActiveSubtitleFrame()
          end

          '''
          text = text.replace(marker2, native_fn + marker2, 1)
          old_hook = 'pcall(mem.autohook2, callAddress + 5, drawActiveSubtitleFrame)'
          assert old_hook in text
          text = text.replace(old_hook, 'pcall(mem.autohook2, callAddress + 5, drawNativeSubtitleFrame)', 1)
          old_comment = '''    -- Keep this path as a fallback for builds whose movie player yields to the
              -- regular renderer. The native Bink/Smacker hooks above handle Rodril's
              -- synchronous full-screen movie loops.
          '''
          if old_comment in text:
              text = text.replace(old_comment, '''    -- Keep this path as a fallback for builds whose movie player yields to the
              -- regular renderer. Native frame drawing is intentionally limited to MM8
              -- because MM6/MM7 intro playback crashed when CustomUI was drawn there.
          ''', 1)
          export_marker = 'KMS.DrawActiveSubtitleFrame = drawActiveSubtitleFrame\n'
          assert export_marker in text
          text = text.replace(export_marker, export_marker + 'KMS.DrawNativeSubtitleFrame = drawNativeSubtitleFrame\nKMS.NativeSafeStems = NATIVE_SAFE_STEMS\n', 1)
          path.write_text(text, encoding='utf-8')

          # Update standalone subtitle regression to enforce the safety gate.
          Path('tools/test_korean_movie_subtitles.lua').write_text(r'''-- Standalone Lua 5.1 regression test for KoreanMovieSubtitles.lua.
          local now = 0
          local drawCalls = {}
          local nativeHooks = {}

          timeGetTime = function() return now end
          string.convert = function(s, from, to)
              assert(from == "utf8")
              assert(to == 949)
              return s
          end

          Game = {
              Version = 8,
              Lucida_fnt = 123,
              IsMoviePlaying = function() return true end
          }
          CustomUI = {
              ShowText = function(...)
                  drawCalls[#drawCalls + 1] = {...}
              end
          }
          mem = {
              u1 = setmetatable({}, {
                  __index = function(_, address)
                      if address == 0x4BC9C7 or address == 0x4BCBE6 then
                          return 0xE8
                      end
                      return 0
                  end
              }),
              autohook2 = function(address, handler)
                  nativeHooks[address] = handler
              end
          }
          events = {}
          Merge = nil
          Log = nil

          dofile("Scripts/General/KoreanMovieSubtitles.lua")
          local KMS = KoreanMovieSubtitles

          assert(KMS.Version == "1.2")
          assert(KMS.NormalizeMovieName('  "7INTRO.smk"  ') == "7intro")
          assert(KMS.NormalizeMovieName("Anims\\DragonHunters.bik") == "dragonhunters")
          assert(KMS.ParseTimestamp("00:02:03,456") == 123456)

          local cues = assert(KMS.Load("7intro"))
          assert(#cues == 32)
          assert(KMS.FindCue(cues, 7680).Utf8:find("아이언피스트", 1, true))
          assert(KMS.FindCue(cues, 13000) == nil)

          assert(KMS.NativeFrameHooksInstalled == true)
          assert(KMS.NativeFrameHookCount == 2)
          assert(type(nativeHooks[0x4BC9CC]) == "function", "Bink frame hook was not installed")
          assert(type(nativeHooks[0x4BCBEB]) == "function", "Smacker frame hook was not installed")
          assert(KMS.NativeSafeStems.dragonhunters == true)
          assert(KMS.NativeSafeStems["7intro"] == nil)
          assert(KMS.NativeSafeStems["6intro"] == nil)

          -- MM6/MM7 native callbacks must never draw. This is the crash regression.
          now = 1000
          assert(KMS.StartMovie("7intro"))
          now = 9000
          nativeHooks[0x4BC9CC]()
          assert(#drawCalls == 0, "MM7 native movie callback must be display-disabled")

          -- The ordinary renderer fallback remains available for non-native-safe movies.
          events.PostRender()
          assert(#drawCalls == 5, "PostRender fallback did not draw MM7 subtitle")
          assert(drawCalls[#drawCalls][10] == 0xFFFF)

          -- MM8 movies keep native-frame subtitles.
          drawCalls = {}
          now = 20000
          assert(KMS.StartMovie("dragonhunters"))
          local mm8cues = assert(KMS.Load("dragonhunters"))
          now = 20000 + mm8cues[1].Start + 1
          nativeHooks[0x4BC9CC]()
          assert(#drawCalls == 5, "MM8 native Bink frame hook did not draw subtitle")
          assert(drawCalls[#drawCalls][10] == 0xFFFF)

          KMS.StopMovie()
          assert(KMS.GetActive() == nil)
          assert(KMS.StartMovie("movie-with-no-subtitle") == false)
          print("Korean movie subtitle runtime: OK")
          ''', encoding='utf-8')

          # Require the safety gate in the Python inventory validator too.
          path = Path('tools/validate_korean_movie_subtitles.py')
          text = path.read_text(encoding='utf-8')
          needle = '        "InstallNativeMovieFrameHooks",\n'
          assert needle in text
          text = text.replace(needle, needle + '        "NATIVE_SAFE_STEMS",\n        "drawNativeSubtitleFrame",\n        \'KMS.Version = "1.2"\',\n', 1)
          old_print = 'print(f"Korean cutscene subtitles: OK (19 files, {total_cues} cues; native Bink/Smacker hooks required)")'
          assert old_print in text
          text = text.replace(old_print, 'print(f"Korean cutscene subtitles: OK (19 files, {total_cues} cues; native frame drawing gated to MM8)")', 1)
          path.write_text(text, encoding='utf-8')

          # 2) Systemic dungeon/entrance description shift: Game.TransTxt is 1-based,
          # but the static builder used the IDs as Python zero-based row indexes.
          path = Path('tools/build_static_localization.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def apply_by_order(')
          end = text.index('\ndef load_source(', start)
          replacement = '''def apply_by_order(
              doc: TsvDocument,
              overlay: dict[tuple[int, str], str],
              column: int,
              eligible: Callable[[Row, int], bool],
              *,
              overlay_field: str | None = None,
              record_base: int = 0,
          ) -> int:
              rows = [row for index, row in enumerate(doc.rows) if eligible(row, index)]
              changed = 0
              for (record_id, field), value in overlay.items():
                  if overlay_field is not None and field != overlay_field:
                      continue
                  if not value:
                      continue
                  row_index = record_id - record_base
                  if row_index < 0 or row_index >= len(rows):
                      raise ValueError(
                          f'missing source row-order record {record_id} (base {record_base})'
                      )
                  row = rows[row_index]
                  if len(row.fields) <= column:
                      raise ValueError(f'source row-order record {record_id} has no column {column}')
                  row.fields[column] = encode_field(value)
                  changed += 1
              return changed

          '''
          text = text[:start] + replacement + text[end + 1:]
          old_trans = "reports['Trans.txt'] = apply_by_order(doc, overlay('KO_TransTxt.txt'), 1, trans_row)"
          assert old_trans in text
          text = text.replace(old_trans, "reports['Trans.txt'] = apply_by_order(doc, overlay('KO_TransTxt.txt'), 1, trans_row, record_base=1)", 1)
          path.write_text(text, encoding='utf-8')

          # Runtime repair for already-built v1.0.29 LODs. Read the canonical CP949
          # overlay and assign by the actual 1-based Game.TransTxt index.
          Path('Scripts/General/ZZZZ_KoreanTransTxtIndexFix.lua').write_text(r'''-- Repair the v1.0.29 Trans.txt row-order off-by-one at runtime.
          -- Game.TransTxt is 1-based in MMExtension, and KO_TransTxt.txt IDs follow it.

          KoreanTransTxtIndexFix = KoreanTransTxtIndexFix or {}
          local KTI = KoreanTransTxtIndexFix

          KTI.SourcePath = "Data/Text localization/KO_TransTxt.txt"
          local records = nil

          local function parseRecords(raw)
              local out = {}
              if type(raw) ~= "string" then
                  return out
              end
              raw = raw:gsub("\r\n", "\n"):gsub("\r", "\n")
              for line in (raw .. "\n"):gmatch("([^\n]*)\n") do
                  local _, idText, _, value = line:match("^([^\t]*)\t([^\t]*)\t([^\t]*)\t(.*)$")
                  local id = tonumber(idText)
                  if id and id >= 1 and value and value ~= "" then
                      out[id] = value
                  end
              end
              return out
          end

          local function loadRecords()
              if records then
                  return records
              end
              local f = io.open(KTI.SourcePath, "rb")
              if not f then
                  records = {}
                  return records
              end
              local raw = f:read("*all")
              f:close()
              records = parseRecords(raw)
              KTI.Records = records
              return records
          end

          local function encode(text)
              if KoreanText and type(KoreanText.EncodeOnce) == "function" then
                  return KoreanText.EncodeOnce(text)
              end
              if KoreanFont and type(KoreanFont.encodeSpecial) == "function" then
                  return KoreanFont.encodeSpecial(text)
              end
              return text
          end

          function KTI.Apply()
              if not Game or not Game.TransTxt then
                  return false, 0
              end
              local applied = 0
              for id, value in pairs(loadRecords()) do
                  local ok = pcall(function()
                      Game.TransTxt[id] = encode(value)
                  end)
                  if ok then
                      applied = applied + 1
                  end
              end
              return applied > 0, applied
          end

          KTI.ParseRecords = parseRecords
          KTI.LoadRecords = loadRecords

          function events.GameInitialized1()
              KTI.Apply()
          end

          function events.GameInitialized2()
              KTI.Apply()
          end

          if Game and Game.TransTxt then
              pcall(KTI.Apply)
          end
          ''', encoding='utf-8')

          Path('tools/test_korean_transtxt_index_fix.lua').write_text(r'''-- Standalone Lua 5.1 regression for the 1-based Game.TransTxt repair.
          Game = {TransTxt = {}}
          events = {}
          KoreanText = {EncodeOnce = function(s) return s end}

          dofile("Scripts/General/ZZZZ_KoreanTransTxtIndexFix.lua")
          local KTI = KoreanTransTxtIndexFix
          local records = KTI.LoadRecords()
          assert(records[1] and records[25] and records[41])
          assert(records[0] == nil)

          local ok, count = KTI.Apply()
          assert(ok and count > 0)
          assert(Game.TransTxt[1] == records[1])
          assert(Game.TransTxt[25] == records[25])
          assert(Game.TransTxt[41] == records[41])
          assert(Game.TransTxt[0] == nil)
          print("Korean TransTxt 1-based runtime repair: OK (" .. tostring(count) .. " records)")
          ''', encoding='utf-8')

          Path('tools/validate_korean_transtxt_index_fix.py').write_text(r'''#!/usr/bin/env python3
          from pathlib import Path
          import sys

          root = Path(sys.argv[1] if len(sys.argv) > 1 else '.').resolve()
          overlay = (root / 'Data/Text localization/KO_TransTxt.txt').read_bytes().decode('cp949')
          ids = []
          for line in overlay.splitlines()[1:]:
              parts = line.split('\t', 3)
              if len(parts) >= 4 and parts[1].strip().isdigit():
                  ids.append(int(parts[1].strip()))
          assert ids and ids[0] == 1, ids[:5]
          assert 0 not in ids
          assert 25 in ids and 41 in ids

          runtime = (root / 'Scripts/General/ZZZZ_KoreanTransTxtIndexFix.lua').read_text('utf-8')
          for token in ('Game.TransTxt[id]', 'KO_TransTxt.txt', 'events.GameInitialized1', 'events.GameInitialized2'):
              assert token in runtime, token
          assert runtime.isascii(), 'runtime repair must stay ASCII-only'

          builder = (root / 'tools/build_static_localization.py').read_text('utf-8')
          assert 'record_base: int = 0' in builder
          assert "apply_by_order(doc, overlay('KO_TransTxt.txt'), 1, trans_row, record_base=1)" in builder

          # Direct unit test of the corrected row-order helper.
          namespace = {}
          exec(compile(builder, 'build_static_localization.py', 'exec'), namespace)
          TsvDocument = namespace['TsvDocument']
          apply_by_order = namespace['apply_by_order']
          doc = TsvDocument('100\tA\n200\tB\n300\tC\n')
          changed = apply_by_order(
              doc,
              {(1, ''): 'one', (2, ''): 'two', (3, ''): 'three'},
              1,
              lambda row, index: bool(row.fields and row.fields[0].isdigit()),
              record_base=1,
          )
          assert changed == 3
          assert [row.fields[1] for row in doc.rows] == ['one', 'two', 'three']
          print(f'Korean TransTxt index fix: OK ({len(ids)} overlay records; base=1)')
          ''', encoding='utf-8')

          # README: document the second refresh and remove the obsolete package hash.
          path = Path('README.txt')
          text = path.read_text(encoding='utf-8')
          text = text.replace('v1.0.29 / hotfix refresh 핵심 변경:', 'v1.0.29 / hotfix refresh 2 핵심 변경:', 1)
          old = '''- 한국어 컷신 자막 19개 포함
          - 동기식 Bink/Smacker 영상 재생 중 일반 PostRender가 호출되지 않는 문제를 피해
            네이티브 영상 프레임 루프에서 자막을 그리는 KoreanMovieSubtitles v1.1 적용
          '''
          new = '''- 한국어 컷신 자막 19개 포함
          - KoreanMovieSubtitles v1.2: MM8은 네이티브 Bink/Smacker 프레임 자막 경로 유지
          - MM6/MM7은 네이티브 자막 렌더 중 인트로 튕김이 제보되어 해당 경로를 차단하고
            일반 PostRender fallback만 유지
          - 던전/건물 입장 설명 TransTxt의 1-based 인덱스를 0-based로 잘못 적용한 빌드 오류 수정
          - 기존 v1.0.29 LOD도 KO_TransTxt의 실제 1-based ID로 런타임 재투영해 전체 설명 뒤섞임 보정
          '''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace('- 컷신에서 한국어 자막이 실제 영상 위에 출력되는지\n', '- MM6/MM7 새 게임 인트로가 더 이상 튕기지 않는지\n- MM8 컷신 자막이 실제 영상 위에 출력되는지\n- 던전/건물 입장 설명이 올바른 장소와 일치하는지\n', 1)
          old_hash = '''- 교체본 ZIP SHA-256:
            b16b3bcbf327e676e7eea396d74670d1259a7d559814670bb395e70f0b227c2e
          '''
          if old_hash in text:
              text = text.replace(old_hash, '- 최신 ZIP의 SHA-256은 릴리즈에 함께 첨부된 .sha256 파일을 확인하십시오.\n', 1)
          text = text.replace('  Scripts\\General\\LocalizeTables.lua\n', '  Scripts\\General\\LocalizeTables.lua\n  Scripts\\General\\ZZZZ_KoreanTransTxtIndexFix.lua\n', 1)
          old_movie = '''hotfix refresh의 KoreanMovieSubtitles v1.1은 MM8 네이티브 Bink/Smacker
          영상 프레임 draw 지점을 후킹하고 PostRender는 fallback으로 유지합니다.
          정적 주소/스크립트/자막 데이터 검증은 통과했지만 실게임 출력은 최종 확인이 필요합니다.
          '''
          new_movie = '''첫 hotfix refresh의 KoreanMovieSubtitles v1.1은 모든 자막 영상을 MM8 네이티브
          Bink/Smacker 프레임 draw 지점에서 그리도록 했습니다. 실게임 제보에서 MM6 새 게임은
          영상 직후, MM7은 영상 도중 튕기는 회귀가 확인되어 v1.2에서 네이티브 프레임 렌더를
          MM8 영상 6개로만 제한했습니다. MM6/MM7은 PostRender fallback만 남기므로 우선
          시작 안정성을 보존하며, 별도의 안전한 영상 surface 렌더 경로를 찾기 전까지 자막이
          표시되지 않을 수 있습니다. MM8 네이티브 자막도 실게임 출력 확인은 아직 필요합니다.
          '''
          assert old_movie in text
          text = text.replace(old_movie, new_movie, 1)
          path.write_text(text, encoding='utf-8')

          # Keep a terse changelog entry at the top.
          path = Path('CHANGELOG.txt')
          text = path.read_text(encoding='utf-8')
          entry = '''v1.0.29 Hotfix Refresh 2 (report 66003)
          - Fixed the 1-based Game.TransTxt row-order mapping that shifted dungeon and entrance descriptions.
          - Added an ASCII-only runtime projection from KO_TransTxt so existing v1.0.29 LODs are repaired without replacing gameplay scripts.
          - Gated native movie-frame subtitle drawing to MM8 stems after MM6/MM7 intro crashes were reported with v1.1.
          - Kept PostRender subtitle fallback for MM6/MM7 and native Bink/Smacker subtitles for MM8.
          - Added regression tests for both the TransTxt base index and MM6/MM7 native subtitle safety gate.

          '''
          if not text.startswith('v1.0.29 Hotfix Refresh 2'):
              path.write_text(entry + text, encoding='utf-8')
          PY

      - name: Validate patched files
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 >/dev/null
          python tools/validate_korean_movie_subtitles.py .
          python tools/validate_korean_transtxt_index_fix.py .
          python tools/validate_rodril_overlay_boundary.py
          luac5.1 -p Scripts/General/KoreanMovieSubtitles.lua
          luac5.1 -p Scripts/General/ZZZZ_KoreanTransTxtIndexFix.lua
          luac5.1 -p tools/test_korean_movie_subtitles.lua
          luac5.1 -p tools/test_korean_transtxt_index_fix.lua
          lua5.1 tools/test_korean_movie_subtitles.lua
          lua5.1 tools/test_korean_transtxt_index_fix.lua

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/General/KoreanMovieSubtitles.lua \
                  Scripts/General/ZZZZ_KoreanTransTxtIndexFix.lua \
                  tools/test_korean_movie_subtitles.lua \
                  tools/validate_korean_movie_subtitles.py \
                  tools/test_korean_transtxt_index_fix.lua \
                  tools/validate_korean_transtxt_index_fix.py \
                  tools/build_static_localization.py \
                  README.txt CHANGELOG.txt
          git commit -m "fix: repair TransTxt mapping and MM6/MM7 movie crashes"
          git push origin HEAD:main
