name: Fix runtime override encoding

on:
  push:
    branches:
      - fix/runtime-overrides-euc-kr
    paths:
      - .github/workflows/fix-runtime-override-encoding.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch generator and regenerate runtime overlay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/rebuild_runtime_overrides.py')
          text = path.read_text(encoding='utf-8')

          old_write = '''    if args.write:\n        args.output.parent.mkdir(parents=True, exist_ok=True)\n        args.output.write_bytes(generated.encode("utf-8"))\n        print(f"  wrote:              {args.output}")\n        return 0\n\n    if not args.output.is_file():\n        print(f"missing generated runtime file: {args.output}", file=sys.stderr)\n        return 1\n    existing = read_text(args.output)\n    if normalized_records(existing) != normalized_records(generated):\n        print(\n            "KO_RuntimeOverrides.txt has drifted from canonical Korean tables; "\n            "run tools/rebuild_runtime_overrides.py --write",\n            file=sys.stderr,\n        )\n        return 1\n    print("  drift check:        OK")\n    return 0\n'''

          new_write = '''    try:\n        expected_bytes = generated.encode("euc_kr")\n    except UnicodeEncodeError as exc:\n        print(\n            f"KO_RuntimeOverrides.txt contains text outside EUC-KR: {exc}",\n            file=sys.stderr,\n        )\n        return 1\n\n    if args.write:\n        args.output.parent.mkdir(parents=True, exist_ok=True)\n        args.output.write_bytes(expected_bytes)\n        print(f"  wrote EUC-KR:       {args.output}")\n        return 0\n\n    if not args.output.is_file():\n        print(f"missing generated runtime file: {args.output}", file=sys.stderr)\n        return 1\n    existing_bytes = args.output.read_bytes()\n    if existing_bytes != expected_bytes:\n        existing = read_text(args.output)\n        if normalized_records(existing) != normalized_records(generated):\n            reason = "text content drift"\n        else:\n            reason = "wrong byte encoding or line endings (runtime requires EUC-KR/CRLF)"\n        print(\n            "KO_RuntimeOverrides.txt has drifted from the exact runtime bytes: "\n            f"{reason}; run tools/rebuild_runtime_overrides.py --write",\n            file=sys.stderr,\n        )\n        return 1\n    print("  byte/encoding check: OK (EUC-KR, CRLF)")\n    return 0\n'''

          if old_write not in text:
              raise SystemExit('expected generator block not found')
          text = text.replace(old_write, new_write, 1)

          old_doc = '''fields when loading generic long-overlay records.\n"""'''
          new_doc = '''fields when loading generic long-overlay records. The generated runtime file is\nencoded as EUC-KR because FNT_DBCS.lua consumes raw EUC-KR bytes.\n"""'''
          if old_doc not in text:
              raise SystemExit('expected docstring marker not found')
          text = text.replace(old_doc, new_doc, 1)
          path.write_text(text, encoding='utf-8', newline='')
          PY

          python tools/rebuild_runtime_overrides.py --write
          python tools/rebuild_runtime_overrides.py --check

          python - <<'PY'
          from pathlib import Path
          p = Path('Data/Text localization/KO_RuntimeOverrides.txt')
          data = p.read_bytes()
          text = data.decode('euc_kr')
          if 'GlobalTxt\t0\t\t방어' not in text:
              raise SystemExit('expected GlobalTxt Korean runtime record missing')
          try:
              data.decode('utf-8')
          except UnicodeDecodeError:
              pass
          else:
              raise SystemExit('runtime overlay unexpectedly remains UTF-8 decodable')
          print(f'EUC-KR runtime overlay verified: {len(data)} bytes')
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/rebuild_runtime_overrides.py 'Data/Text localization/KO_RuntimeOverrides.txt'
          git commit -m 'fix(i18n): write runtime overrides as EUC-KR'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
