name: Release v1.0.14

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.0.14.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v1.0.14"
          ASSET="MMMerge_Korean_${VERSION}_Release.zip"
          rm -rf release-stage
          mkdir -p release-stage

          cp -a Data release-stage/
          cp -a DataFiles release-stage/
          cp -a Scripts release-stage/
          cp README.txt release-stage/
          cp CHANGELOG.txt release-stage/
          cp FONT_LICENSES.md release-stage/
          cp STR_TRANSLATION_COVERAGE.txt release-stage/
          cp RUNTIME_LOCALIZATION_AUDIT.txt release-stage/
          cp DBCS_REFACTOR_AUDIT.txt release-stage/
          cp UI_RENDER_CORRUPTION_AUDIT.txt release-stage/

          (
            cd release-stage
            find Data DataFiles Scripts -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum README.txt CHANGELOG.txt FONT_LICENSES.md \
              STR_TRANSLATION_COVERAGE.txt RUNTIME_LOCALIZATION_AUDIT.txt \
              DBCS_REFACTOR_AUDIT.txt UI_RENDER_CORRUPTION_AUDIT.txt \
              >> SHA256SUMS.txt
            zip -9 -X -r "../${ASSET}" .
          )

          ZIP_SHA="$(sha256sum "${ASSET}" | awk '{print $1}')"
          printf '%s  %s\n' "${ZIP_SHA}" "${ASSET}" > "${ASSET}.sha256"

          cat > release-notes.md <<EOF
          ## v1.0.14 UI 렌더링 안정화 핫픽스

          장시간 플레이 중 HUD, ESC 메뉴, 상점·마구간 등 2D 인터페이스가 사라지지만
          월드 화면, 음성, 클릭 판정, 구매·이동 로직은 계속 작동하고 게임을 완전히
          재시작하면 정상화된다는 제보를 바탕으로 한글 폰트 렌더러의 메모리 복구
          경로를 보강했습니다.

          ### 주요 수정
          - 오래된 host-font 메모리 스냅샷을 프로세스 수명 동안 재사용하던 경로 제거
          - 폰트 identity를 복구 전에 검증해 재사용된 주소에 stale 데이터를 쓰지 않도록 수정
          - glyph 7 백업 범위를 실제 덮어쓰는 바이트 수로 제한
          - glyph bitmap과 width/before/after metric을 함께 즉시 복구
          - DBCS 페이지 폰트 캐시의 stale allocation 감지 및 재로드
          - offline fake-FNT 메모리 하네스로 정확 복구와 stale-write 차단 검증

          ### 포함 내용
          v1.0.13c까지의 지도명·던전명·시설·오브젝트 및 반응 문구 번역을 모두 포함합니다.

          ### 설치
          ZIP의 내용을 Might and Magic 8 / MMMerge 설치 폴더에 그대로 덮어쓰십시오.
          구버전의 `Scripts/General/KoreanFont.lua`를 다시 복사하지 마십시오.

          ### 검증 상태
          코드상 확인된 메모리 오염 가능 경로와 stale pointer 복구 경로를 차단했고,
          오프라인 메모리 하네스 검증을 통과했습니다. 동일 증상을 실제 장시간 플레이로
          직접 재현할 환경은 없어 사용자 제보 기반 안정화 핫픽스로 배포합니다.

          ZIP SHA-256:

          `${ZIP_SHA}`
          EOF

          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.14"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
            gh release edit "$TAG" --title "MMMerge 한국어 패치 v1.0.14" --notes-file release-notes.md
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
              --target "$GITHUB_SHA" \
              --title "MMMerge 한국어 패치 v1.0.14" \
              --notes-file release-notes.md
          fi
