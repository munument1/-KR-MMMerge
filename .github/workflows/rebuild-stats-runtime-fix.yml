name: Rebuild bounded stats runtime projection

on:
  push:
    branches:
      - fix/stats-experience-ctd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/stats-experience-ctd

      - name: Rebuild runtime projection
        run: |
          set -euo pipefail
          python tools/rebuild_stats_skills_runtime.py --write
          python tools/rebuild_stats_skills_runtime.py --check
          python - <<'PY'
          from pathlib import Path
          data = Path('Data/Text localization/KO_StatsSkillsRuntime.txt').read_bytes()
          text = data.decode('euc_kr')
          ids = []
          current = ''
          for line in text.splitlines()[1:]:
              p = line.split('\t', 3)
              if len(p) < 4:
                  continue
              if p[0]:
                  current = p[0]
              if current == 'StatsDescriptions' and p[1].isdigit():
                  ids.append(int(p[1]))
          assert ids == list(range(7)), ids
          print('StatsDescriptions runtime bounds: 0..6 OK')
          PY

      - name: Commit generated runtime data
        run: |
          set -euo pipefail
          if git diff --quiet -- 'Data/Text localization/KO_StatsSkillsRuntime.txt'; then
            echo 'Runtime projection already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Data/Text localization/KO_StatsSkillsRuntime.txt'
          git commit -m 'fix: regenerate bounded stats runtime data'
          git push origin HEAD:fix/stats-experience-ctd
