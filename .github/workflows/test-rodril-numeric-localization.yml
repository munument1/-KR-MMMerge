name: Test Rodril localization semantics

on:
  pull_request:
    paths:
      - Scripts/General/LocalizeTables.lua
      - Scripts/General/ZZ_KoreanRodrilNumericLocalization.lua
      - tools/audit_rodril_localizer_semantics.py
      - tools/test_localize_tables_upstream_semantics.lua
      - tools/test_korean_rodril_numeric_localization.lua
      - .github/workflows/test-rodril-numeric-localization.yml
  push:
    branches:
      - main
    paths:
      - Scripts/General/LocalizeTables.lua
      - Scripts/General/ZZ_KoreanRodrilNumericLocalization.lua
      - tools/audit_rodril_localizer_semantics.py
      - tools/test_localize_tables_upstream_semantics.lua
      - tools/test_korean_rodril_numeric_localization.lua
      - .github/workflows/test-rodril-numeric-localization.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 >/dev/null

      - name: Lua syntax
        run: |
          luac5.1 -p Scripts/General/LocalizeTables.lua
          luac5.1 -p Scripts/General/ZZ_KoreanRodrilNumericLocalization.lua
          luac5.1 -p tools/test_localize_tables_upstream_semantics.lua
          luac5.1 -p tools/test_korean_rodril_numeric_localization.lua

      - name: LocalizeTables upstream semantics
        run: lua5.1 tools/test_localize_tables_upstream_semantics.lua

      - name: NPC hiring numeric safety net
        run: lua5.1 tools/test_korean_rodril_numeric_localization.lua

      - name: Static semantics audit
        run: python tools/audit_rodril_localizer_semantics.py
