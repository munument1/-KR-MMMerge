name: Validate PO round trip

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      # PO pushes are materialized and round-trip checked by sync-po-to-korean.yml.
      # This standalone push gate watches generated/source structure changes.
      - tools/build_korean_from_po.py
      - tools/build_mm8lang_from_po.py
      - mm8lang.ini
      - 'Data/Text localization/KO_*.txt'
      - 'Data/Text localization/KO_*.tsv'
      - .github/workflows/validate-po-roundtrip.yml
  pull_request:
    paths:
      - translations/ko/mmmerge.po
      - translations/ko/PO_BOOTSTRAP_REPORT.json
      - tools/build_korean_from_po.py
      - tools/build_mm8lang_from_po.py
      - mm8lang.ini
      - 'Data/Text localization/KO_*.txt'
      - 'Data/Text localization/KO_*.tsv'
      - .github/workflows/validate-po-roundtrip.yml

permissions:
  contents: read

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PO dependency
        run: python -m pip install --disable-pip-version-check polib

      - name: Require current PO to reproduce canonical Korean bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/po-roundtrip
          python tools/build_korean_from_po.py \
            --output-root build/po-roundtrip \
            --require-byte-identical
          python tools/build_mm8lang_from_po.py \
            --output build/mm8lang-roundtrip.ini \
            --require-byte-identical

      - name: Exercise every table materializer format with temporary PO edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import polib

          selected = [
              'KO_AwardsTxt.txt',
              'KO_ItemsTxt.txt',
              'KO_MapStrings.txt',
              'KO_GlobalTxt.txt',
              'KO_StatsDescriptions.tsv',
              'KO_NPCProfessions.txt',
              'KO_Skilldes.txt',
              'KO_NPCNames.txt',
          ]
          po = polib.pofile('translations/ko/mmmerge.po')
          changed = {}
          for target in selected:
              marker = f'KO: Data/Text localization/{target}'
              entry = next((e for e in po if not e.obsolete and marker in (e.comment or '')), None)
              if entry is None:
                  raise SystemExit(f'no PO entry found for {target}')
              entry.msgstr = entry.msgstr + ' RT'
              changed[target] = entry.msgctxt
          Path('build').mkdir(exist_ok=True)
          po.save('build/mmmerge-mutated.po')
          for target, context in changed.items():
              print(f'mutated {target}: {context}')
          PY

          rm -rf build/po-mutated build/po-mutated-second
          python tools/build_korean_from_po.py \
            --po build/mmmerge-mutated.po \
            --output-root build/po-mutated

          python - <<'PY'
          from pathlib import Path

          selected = [
              'KO_AwardsTxt.txt',
              'KO_ItemsTxt.txt',
              'KO_MapStrings.txt',
              'KO_GlobalTxt.txt',
              'KO_StatsDescriptions.tsv',
              'KO_NPCProfessions.txt',
              'KO_Skilldes.txt',
              'KO_NPCNames.txt',
          ]
          for name in selected:
              original = Path('Data/Text localization') / name
              generated = Path('build/po-mutated/Data/Text localization') / name
              if original.read_bytes() == generated.read_bytes():
                  raise SystemExit(f'materializer did not change exercised target: {name}')
              print(f'write path exercised: {name}')
          PY

          python tools/build_korean_from_po.py \
            --po build/mmmerge-mutated.po \
            --source-root 'build/po-mutated/Data/Text localization' \
            --output-root build/po-mutated-second \
            --require-byte-identical

      - name: Exercise root mm8lang materializer with a temporary PO edit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import polib

          po = polib.pofile('translations/ko/mmmerge.po')
          context = 'mm8/mm8lang.ini|section=Settings|key=DoubleSpeed'
          entry = next((e for e in po if not e.obsolete and e.msgctxt == context), None)
          if entry is None:
              raise SystemExit('DoubleSpeed mm8lang PO entry not found')
          entry.msgstr = entry.msgstr + ' RT'
          po.save('build/mmmerge-mm8lang-mutated.po')
          print('mutated mm8lang:', context)
          PY

          python tools/build_mm8lang_from_po.py \
            --po build/mmmerge-mm8lang-mutated.po \
            --output build/mm8lang-mutated.ini

          python - <<'PY'
          from pathlib import Path
          original = Path('mm8lang.ini').read_bytes()
          generated = Path('build/mm8lang-mutated.ini').read_bytes()
          if original == generated:
              raise SystemExit('mm8lang materializer did not change the mutated target')
          generated.decode('cp949')
          print('mm8lang write path exercised with valid CP949 output')
          PY

          python tools/build_mm8lang_from_po.py \
            --po build/mmmerge-mm8lang-mutated.po \
            --source build/mm8lang-mutated.ini \
            --output build/mm8lang-mutated-second.ini \
            --require-byte-identical
