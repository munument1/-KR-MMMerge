name: Refresh v1.0.29 hireling display fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-v1.0.29-hireling-display.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: d8782ca70fb5e5c5c581fb6c6401b754c267aac0
      TAG: v1.0.29
      ASSET: MMMerge_Korean_v1.0.29_Release.zip
    steps:
      - name: Checkout pinned product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lua 5.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 >/dev/null

      - name: Validate hotfix source
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_hireling_experience_fix.py .
          python tools/validate_rodril_overlay_boundary.py
          python tools/validate_korean_movie_subtitles.py .
          python tools/validate_korean_transtxt_index_fix.py .
          python tools/audit_runtime_translation_ownership.py
          luac5.1 -p Scripts/Global/ZZZZ_KoreanHirelingExperienceFix.lua
          luac5.1 -p Scripts/General/KoreanMovieSubtitles.lua
          luac5.1 -p Scripts/General/ZZZZ_KoreanTransTxtIndexFix.lua

      - name: Build replacement package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-stage "$ASSET" "$ASSET.sha256"
          mkdir -p release-stage
          cp -a Data release-stage/
          cp -a DataFiles release-stage/
          cp -a Scripts release-stage/
          cp mm8lang.ini release-stage/
          cp FONT_LICENSES.md release-stage/
          cp README.txt release-stage/

          test -f release-stage/Scripts/Global/ZZZZ_KoreanHirelingExperienceFix.lua
          test -f release-stage/Scripts/General/KoreanMovieSubtitles.lua
          test -f release-stage/Scripts/General/ZZZZ_KoreanTransTxtIndexFix.lua
          test ! -f release-stage/Scripts/Maps/out01.lua

          (
            cd release-stage
            zip -9 -X -r "../$ASSET" . >/dev/null
          )
          ZIP_SHA="$(sha256sum "$ASSET" | awk '{print $1}')"
          printf '%s  %s\n' "$ZIP_SHA" "$ASSET" > "$ASSET.sha256"
          echo "ZIP_SHA=$ZIP_SHA" >> "$GITHUB_ENV"
          echo "ZIP_SIZE=$(stat -c%s "$ASSET")" >> "$GITHUB_ENV"

      - name: Replace v1.0.29 assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git tag -f "$TAG" "$SOURCE_SHA"
          git push origin "refs/tags/$TAG" --force
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

          cat > release-notes.md <<'EOF'
          ## MMMerge 한국어 패치 v1.0.29 — Hotfix Refresh 4

          기존 v1.0.29 배포 파일을 다시 교체했습니다. 같은 v1.0.29을 먼저 받은 사용자는 최신 ZIP을 다시 받아 덮어쓰십시오.

          ### 고용 NPC 학습 보너스 표시/계산
          - 직전 호환 보정이 `events.GetSkill`에서 학자/교사/강사의 +5/+10/+15를 제거하면서 캐릭터 시트의 학습 보너스 표시까지 사라지는 회귀가 있었습니다.
          - 이제 Rodril의 원래 `GetSkill` 표시 경로는 건드리지 않아 학습 하단 보너스가 다시 보입니다.
          - 실제 경험치 계산은 `GetLearningTotalSkill`에서 숙련도에 의해 중복 확대되는 부분만 차감합니다.
          - 따라서 표시값은 +5/+10/+15를 유지하면서 실제 경험치 기여도도 숙련도와 무관하게 평면 +5%/+10%/+15%가 되도록 보정했습니다.
          - 런타임 Lua는 raw UTF-8 한글을 넣지 않고 기존 EUC-KR decimal byte escape 방식을 유지합니다.

          ### 이전 Hotfix Refresh 3 포함
          - MMMerge 컷신 자막 런타임 후킹 완전 비활성화 및 원본 영상 재생 경로 보존
          - TransTxt 1-based 인덱스 보정으로 던전/건물 입장 설명 뒤섞임 수정
          - MM7 민간인/경비 목격 적대 호환 보정
          - v1.0.29 기존 번역/스탯/UI 교정 유지

          ### 확인 필요
          자동 검증은 통과했지만 실게임 확인은 별도입니다. 학자/교사/강사를 고용했을 때 캐릭터 시트 학습 하단에 +5/+10/+15가 보이는지와 실제 경험치 획득량이 해당 비율만큼 증가하는지 확인해 주십시오.

          Product source: `__SOURCE_SHA__`

          ZIP size: `__ZIP_SIZE__` bytes

          ZIP SHA-256: `__ZIP_SHA__`
          EOF

          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('release-notes.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('__SOURCE_SHA__', os.environ['SOURCE_SHA'])
          text = text.replace('__ZIP_SIZE__', os.environ['ZIP_SIZE'])
          text = text.replace('__ZIP_SHA__', os.environ['ZIP_SHA'])
          path.write_text(text, encoding='utf-8')
          PY

          gh release edit "$TAG" \
            --title "MMMerge 한국어 패치 v1.0.29" \
            --notes-file release-notes.md \
            --latest

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName,name,url,assets >/tmp/release.json
          cat /tmp/release.json

          REMOTE_TAG="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          test "$REMOTE_TAG" = "$SOURCE_SHA"

          rm -rf published
          mkdir published
          gh release download "$TAG" \
            --pattern "$ASSET" \
            --pattern "$ASSET.sha256" \
            --dir published
          (
            cd published
            sha256sum -c "$ASSET.sha256"
          )
          PUBLISHED_SHA="$(sha256sum "published/$ASSET" | awk '{print $1}')"
          test "$PUBLISHED_SHA" = "$ZIP_SHA"
          echo "Published $ASSET SHA-256: $PUBLISHED_SHA"
