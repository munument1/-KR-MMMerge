name: Patch wide PO materializer preservation v2

on:
  push:
    branches:
      - po-localization-bootstrap
    paths:
      - .github/workflows/patch-wide-materializer-preserve-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PO dependency
        run: python -m pip install --disable-pip-version-check polib

      - name: Preserve untouched TSV bytes when materializing PO edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/build_korean_from_po.py')
          text = path.read_text(encoding='utf-8')
          old = '''def write_wide(rows: list[list[str]], newline: str, trailing_newline: bool) -> str:
              buf = io.StringIO(newline="")
              writer = csv.writer(
                  buf,
                  delimiter="\\t",
                  quotechar='"',
                  doublequote=True,
                  lineterminator=newline,
                  quoting=csv.QUOTE_MINIMAL,
              )
              writer.writerows(rows)
              value = buf.getvalue()
              if not trailing_newline:
                  value = value.rstrip("\\r\\n")
              return value
          '''
          new = '''def split_raw_tsv_record(line: str) -> list[str]:
              fields = []
              start = 0
              in_quotes = False
              i = 0
              while i < len(line):
                  ch = line[i]
                  if ch == '"':
                      if in_quotes and i + 1 < len(line) and line[i + 1] == '"':
                          i += 2
                          continue
                      in_quotes = not in_quotes
                  elif ch == "\\t" and not in_quotes:
                      fields.append(line[start:i])
                      start = i + 1
                  i += 1
              if in_quotes:
                  raise ValueError("unterminated quoted TSV field")
              fields.append(line[start:])
              return fields


          def encode_wide_field_like(raw: str, value: str) -> str:
              quoted = len(raw) >= 2 and raw.startswith('"') and raw.endswith('"')
              if quoted or any(ch in value for ch in ('\\t', '\\r', '\\n', '"')):
                  return '"' + value.replace('"', '""') + '"'
              return value


          def write_wide(rows: list[list[str]], doc: TextFile) -> str:
              original_rows = read_wide(doc.text)
              raw_lines = doc.text.splitlines()
              if len(original_rows) != len(rows) or len(raw_lines) != len(rows):
                  raise ValueError(
                      "wide-table row count changed or contains embedded physical newlines; "
                      "refusing to reformat the whole legacy table"
                  )

              output = []
              for row_no, (original, desired, raw_line) in enumerate(
                      zip(original_rows, rows, raw_lines), 1):
                  raw_fields = split_raw_tsv_record(raw_line)
                  width = max(len(original), len(desired))
                  original = original + [""] * (width - len(original))
                  desired = desired + [""] * (width - len(desired))
                  raw_fields = raw_fields + [""] * (width - len(raw_fields))
                  if len(raw_fields) != width:
                      raise ValueError(f"wide-table raw field mismatch at row {row_no}")
                  for column, (before, after) in enumerate(zip(original, desired)):
                      if before != after:
                          raw_fields[column] = encode_wide_field_like(raw_fields[column], after)
                  output.append("\\t".join(raw_fields))

              result = doc.newline.join(output)
              if doc.text.endswith(("\\n", "\\r")):
                  result += doc.newline
              return result
          '''
          if old not in text:
              raise SystemExit('write_wide implementation did not match expected source')
          text = text.replace(old, new, 1)
          old_call = 'write_wide(rows, doc.newline, doc.text.endswith(("\\n", "\\r")))'
          count = text.count(old_call)
          if count != 6:
              raise SystemExit(f'expected 6 legacy write_wide calls, found {count}')
          text = text.replace(old_call, 'write_wide(rows, doc)')
          path.write_text(text, encoding='utf-8', newline='')
          PY

          git diff --check -- tools/build_korean_from_po.py

      - name: Restore legacy Items formatting and rematerialize only PO changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout 55cdc07faf25796f08ec341b0e4b9de0838d26ae -- 'Data/Text localization/KO_ItemsTxt.txt'
          rm -rf build/po-format-fix build/po-format-check
          python tools/build_korean_from_po.py --output-root build/po-format-fix
          cp 'build/po-format-fix/Data/Text localization/KO_ItemsTxt.txt' 'Data/Text localization/KO_ItemsTxt.txt'
          python tools/rebuild_runtime_overrides.py --write
          python tools/rebuild_runtime_overrides.py --check
          python tools/build_korean_from_po.py --output-root build/po-format-check --require-byte-identical
          python tools/validate_reported_localization_fixes.py .

          python - <<'PY'
          import subprocess
          out = subprocess.check_output([
              'git', 'diff', '--numstat', '--', 'Data/Text localization/KO_ItemsTxt.txt'
          ], text=True).strip()
          print('KO_ItemsTxt numstat:', out)
          if not out:
              raise SystemExit('expected the canonical item terminology fix to remain')
          added, deleted, _ = out.split('\t', 2)
          if int(added) > 3 or int(deleted) > 3:
              raise SystemExit(f'KO_ItemsTxt was unnecessarily reformatted: {out}')
          PY

      - name: Commit focused materializer fix
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            tools/build_korean_from_po.py
            'Data/Text localization/KO_ItemsTxt.txt'
            'Data/Text localization/KO_RuntimeOverrides.txt'
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'fix(i18n): preserve wide table formatting on PO materialization'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
