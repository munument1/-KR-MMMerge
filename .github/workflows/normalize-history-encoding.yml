name: Normalize Korean history encoding

on:
  workflow_dispatch:
  push:
    branches:
      - po-localization-bootstrap
    paths:
      - .github/workflows/normalize-history-encoding.yml
      - tools/validate_korean_history_encoding.py

permissions:
  contents: write

concurrency:
  group: normalize-ko-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Convert history tables to strict EUC-KR
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('Data/Text localization/MM6History_KO.txt'),
              Path('Data/Text localization/MM7History_KO.txt'),
              Path('Data/Text localization/MM8History_KO.txt'),
          ]

          for path in files:
              data = path.read_bytes()
              source_encoding = None
              try:
                  text = data.decode('utf-8-sig')
                  source_encoding = 'utf-8'
              except UnicodeDecodeError:
                  try:
                      text = data.decode('euc_kr')
                      source_encoding = 'euc-kr'
                  except UnicodeDecodeError as exc:
                      raise SystemExit(f'{path}: neither UTF-8 nor strict EUC-KR: {exc}')

              try:
                  encoded = text.encode('euc_kr')
              except UnicodeEncodeError as exc:
                  bad = text[exc.start:exc.end]
                  details = ', '.join(f'U+{ord(ch):04X} {ch!r}' for ch in bad)
                  raise SystemExit(
                      f'{path}: text contains characters outside strict EUC-KR at '
                      f'{exc.start}:{exc.end}: {details}'
                  )

              path.write_bytes(encoded)
              print(f'{path}: {source_encoding} -> euc-kr ({len(data)} -> {len(encoded)} bytes)')
          PY

      - name: Validate game-byte history layout
        run: python tools/validate_korean_history_encoding.py

      - name: Lua 5.1 history regression
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 >/dev/null
          luac5.1 -p Scripts/General/KoreanHistory.lua
          luac5.1 -p tools/test_korean_history.lua
          luac5.1 -p tools/test_korean_history_all_continents.lua
          lua5.1 tools/test_korean_history.lua
          lua5.1 tools/test_korean_history_all_continents.lua

      - name: Commit normalized runtime bytes
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            'Data/Text localization/MM6History_KO.txt'
            'Data/Text localization/MM7History_KO.txt'
            'Data/Text localization/MM8History_KO.txt'
          )
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo 'History tables are already strict EUC-KR.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m 'build(i18n): encode Korean history tables as EUC-KR'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
