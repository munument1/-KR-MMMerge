name: Refresh v1.0.29 without movie subtitles

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-v1.0.29-no-subtitles.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: 99dcef3031f60a3b3db6cb05c7d00e6940b6cb4f
      TAG: v1.0.29
      ASSET: MMMerge_Korean_v1.0.29_Release.zip
    steps:
      - name: Checkout product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check polib
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 >/dev/null

      - name: Validate hotfix source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python tools/validate_korean_movie_subtitles.py .
          luac5.1 -p Scripts/General/KoreanMovieSubtitles.lua
          luac5.1 -p tools/test_korean_movie_subtitles.lua
          lua5.1 tools/test_korean_movie_subtitles.lua
          python tools/validate_korean_transtxt_index_fix.py .
          luac5.1 -p Scripts/General/ZZZZ_KoreanTransTxtIndexFix.lua
          luac5.1 -p tools/test_korean_transtxt_index_fix.lua
          lua5.1 tools/test_korean_transtxt_index_fix.lua
          python tools/validate_hireling_experience_fix.py .
          python tools/validate_mm7_civilian_witness_fix.py .
          python tools/validate_rodril_overlay_boundary.py
          python tools/audit_runtime_translation_ownership.py --json build/runtime-ownership-refresh3.json

          grep -Fq 'KMS.Version = "disabled"' Scripts/General/KoreanMovieSubtitles.lua
          ! grep -Fq 'events.ShowMovie' Scripts/General/KoreanMovieSubtitles.lua
          ! grep -Fq 'events.PostRender' Scripts/General/KoreanMovieSubtitles.lua
          ! grep -Fq 'CustomUI.ShowText' Scripts/General/KoreanMovieSubtitles.lua
          ! grep -Fq 'mem.autohook' Scripts/General/KoreanMovieSubtitles.lua

      - name: Build replacement package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-stage "$ASSET" "$ASSET.sha256"
          mkdir -p release-stage
          cp -a Data release-stage/
          cp -a DataFiles release-stage/
          cp -a Scripts release-stage/
          cp mm8lang.ini release-stage/
          cp FONT_LICENSES.md release-stage/
          cp README.txt release-stage/
          cp CHANGELOG.txt release-stage/

          test -f release-stage/Scripts/General/KoreanMovieSubtitles.lua
          grep -Fq 'KMS.Version = "disabled"' release-stage/Scripts/General/KoreanMovieSubtitles.lua
          ! grep -Fq 'events.ShowMovie' release-stage/Scripts/General/KoreanMovieSubtitles.lua
          ! grep -Fq 'CustomUI.ShowText' release-stage/Scripts/General/KoreanMovieSubtitles.lua
          test -f release-stage/Scripts/General/ZZZZ_KoreanTransTxtIndexFix.lua
          test -f release-stage/Scripts/Global/ZZZZ_KoreanHirelingExperienceFix.lua
          test -f release-stage/Scripts/Global/ZZZZ_KoreanMM7CivilianWitnessFix.lua
          test ! -f release-stage/Scripts/Maps/out01.lua

          (
            cd release-stage
            zip -9 -X -r "../$ASSET" . >/dev/null
          )
          ZIP_SHA="$(sha256sum "$ASSET" | awk '{print $1}')"
          printf '%s  %s\n' "$ZIP_SHA" "$ASSET" > "$ASSET.sha256"
          echo "ZIP_SHA=$ZIP_SHA" >> "$GITHUB_ENV"

      - name: Replace v1.0.29 release in place
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -f "$TAG" "$SOURCE_SHA"
          git push origin "refs/tags/$TAG" --force

          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

          cat > release-notes.md <<EOF
          ## MMMerge 한국어 패치 v1.0.29 — Hotfix Refresh 3

          플레이어 제보를 반영해 기존 v1.0.29 배포 파일을 다시 교체했습니다.
          같은 v1.0.29을 먼저 받은 사용자는 최신 ZIP을 다시 받아 덮어쓰십시오.

          ### 컷신 안정성
          - MMMerge 컷신 한국어 자막 기능을 완전히 비활성화했습니다.
          - Bink/Smacker 네이티브 영상 루프, ShowMovie/PostRender 자막 처리, 영상 중 CustomUI 호출을 더 이상 사용하지 않습니다.
          - 과거 hotfix의 자막 후킹 Lua가 설치 폴더에 남지 않도록 `Scripts/General/KoreanMovieSubtitles.lua`는 무동작 compatibility stub으로 포함됩니다.
          - 하드서브 영상은 배포하지 않습니다.
          - 저장소의 SRT는 번역 소스 보관용이며 게임 런타임에서는 읽지 않습니다.

          ### 던전/건물 설명
          - Game.TransTxt가 1-based인데 빌더가 0-based로 적용해 설명이 한 칸씩 밀리던 오류를 수정했습니다.
          - 기존 v1.0.29 LOD에도 1-based KO_TransTxt를 다시 투영하는 런타임 보정을 포함합니다.

          ### 기존 hotfix 포함
          - 학자/교사/강사 +5%/+10%/+15% 경험치 호환 보정
          - MM7 민간인/경비 목격 적대 호환 보정
          - v1.0.29 기존 번역/스탯/UI 교정 유지

          ### 확인 필요
          자동 검증은 통과했지만 실제 플레이 확인은 별도입니다. 우선 MM6/MM7 새 게임 영상을 재생해 더 이상 튕기지 않는지, 이후 안개섬/아이언피스트 성 및 여러 던전의 입장 설명이 올바른지 확인해 주십시오.

          Product source: `$SOURCE_SHA`

          ZIP SHA-256: `$ZIP_SHA`
          EOF

          gh release edit "$TAG" \
            --title "MMMerge 한국어 패치 v1.0.29" \
            --notes-file release-notes.md \
            --latest

      - name: Verify release ref and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$SOURCE_SHA"
          gh release view "$TAG" --json tagName,name,assets,url > release-verify.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('release-verify.json').read_text())
          names = {a['name'] for a in data['assets']}
          asset = os.environ['ASSET']
          assert asset in names, names
          assert asset + '.sha256' in names, names
          print('release refresh verified:', data['url'])
          PY
