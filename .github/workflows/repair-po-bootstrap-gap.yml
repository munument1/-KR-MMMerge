name: Repair final PO bootstrap gap

on:
  workflow_dispatch:
  push:
    branches:
      - po-localization-bootstrap
    paths:
      - .github/workflows/repair-po-bootstrap-gap.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add missing Zyggie row without changing legacy encoding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('Data/Text localization/KO_NPCNames.txt')
          data = path.read_bytes()
          try:
              text = data.decode('utf-8-sig')
              encoding = 'utf-8'
          except UnicodeDecodeError:
              text = data.decode('cp949')
              encoding = 'cp949'

          normalized = text.replace('\r\n', '\n').replace('\r', '\n')
          lines = normalized.split('\n')
          while lines and lines[-1] == '':
              lines.pop()

          if lines and lines[-1] == '지기\t':
              print('Zyggie is already present as 지기.')
          else:
              if not lines or lines[-1] != '조렉스\t':
                  raise SystemExit(f'unexpected NPCNames tail: {lines[-3:]}')
              lines.append('지기\t')
              newline = '\r\n' if b'\r\n' in data else '\n'
              path.write_bytes((newline.join(lines) + newline).encode(encoding))
              print(f'Added Zyggie -> 지기; preserved {encoding}.')
          PY

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          path='Data/Text localization/KO_NPCNames.txt'
          if [[ -z "$(git status --porcelain -- "$path")" ]]; then
            echo 'NPCNames tail is already complete.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m 'fix(i18n): add missing Zyggie NPC name'
          git push origin "HEAD:${GITHUB_REF_NAME}"
