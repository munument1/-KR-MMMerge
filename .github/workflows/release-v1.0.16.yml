name: Release v1.0.16

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.0.16.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Korean integration
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_native_dbcs_integration.py .
          python tools/validate_reported_localization_fixes.py .
          python tools/patch_reported_terms_lod.py --lod "Data/zz LocKO.T.lod" --check
          python tools/patch_static_stats_lod.py \
            --lod "Data/zz LocKO.T.lod" \
            --translations "Data/Text localization/KO_StatsDescriptions.tsv" \
            --check

          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 >/dev/null
          luac5.1 -p Scripts/General/FNT_DBCS.lua
          luac5.1 -p Scripts/General/KoreanFont.lua
          luac5.1 -p Scripts/General/KoreanFontText.lua
          luac5.1 -p Scripts/General/ZZ_KoreanGameplayFeedbackFixes.lua
          luac5.1 -p Scripts/General/ZZ_KoreanReportedLocalization.lua

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v1.0.16"
          ASSET="MMMerge_Korean_${VERSION}_Release.zip"
          rm -rf release-stage
          mkdir -p release-stage

          cp -a Data release-stage/
          cp -a DataFiles release-stage/
          cp -a Scripts release-stage/
          cp README.txt release-stage/
          cp CHANGELOG.txt release-stage/
          cp FONT_LICENSES.md release-stage/
          cp STR_TRANSLATION_COVERAGE.txt release-stage/
          cp RUNTIME_LOCALIZATION_AUDIT.txt release-stage/
          cp DBCS_REFACTOR_AUDIT.txt release-stage/
          cp UI_RENDER_CORRUPTION_AUDIT.txt release-stage/
          cp NATIVE_DBCS_MIGRATION_AUDIT.txt release-stage/

          python - <<'PY'
          from pathlib import Path
          p = Path('release-stage/README.txt')
          text = p.read_text(encoding='utf-8')
          text = text.replace('MMMerge 한국어 패치 v1.0.15', 'MMMerge 한국어 패치 v1.0.16', 1)
          marker = '이 패치는 Might and Magic 6·7·8 Merge(MMMerge)의 한국어 번역 패치입니다.\n'
          note = (
              'v1.0.16은 사용자 제보를 반영한 번역·UI 보완 릴리스입니다. '
              'v1.0.15의 native DBCS 렌더러 안정화 변경을 모두 포함합니다.\n\n'
              'v1.0.16 주요 변경:\n'
              '- NEW GAME 대륙 선택 화면에 M&M 6 / M&M 7 / M&M 8 표기 추가\n'
              '- 캐릭터 생성 제한 해제 안내문, 능력치 우클릭 툴팁, MM7 역사책 첫 기록 한국어화\n'
              '- 제이덤 / 안타개릭 / 마크햄 및 다수 아이템·설명 용어 교정\n'
              '- 학자/교사/강사 설명을 Merge 실제 학습 스킬 보너스 방식에 맞게 수정\n'
              '- 제보된 구번역 문자열과 정적 LOD 누락에 대한 회귀 검증 추가\n\n'
          )
          if marker in text:
              text = text.replace(marker, marker + note, 1)
          p.write_text(text, encoding='utf-8')
          PY

          cat > release-stage/RELEASE_v1.0.16.txt <<'EOF'
          MMMerge 한국어 패치 v1.0.16

          사용자 제보 반영 및 번역/UI 보완 릴리스입니다.

          - NEW GAME 대륙 선택 화면에 M&M 6 / M&M 7 / M&M 8 표기 추가
          - 캐릭터 생성 클래스/초상화 제한 해제 안내문 한국어화
          - 캐릭터 능력치 우클릭 툴팁 한국어화
          - MM7 역사책 첫 기록(저자의 서문) 한국어화
          - Jadame -> 제이덤, Antagarich -> 안타개릭, Markham -> 마크햄 용어 정리
          - 사드래곤/늑대 눈/과부쥐 열매/포피스냅스/가넷/이동 속도 등 제보 오역 수정
          - 학자/교사/강사의 실제 Merge 동작을 설명에 반영
            (학습 +5/+10/+15이며 학습 숙련도 배율이 적용됨)
          - reported terminology / stats tooltip / Lua 5.1 / native DBCS 회귀 검사 통과
          EOF

          (
            cd release-stage
            find Data DataFiles Scripts -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum README.txt CHANGELOG.txt RELEASE_v1.0.16.txt FONT_LICENSES.md \
              STR_TRANSLATION_COVERAGE.txt RUNTIME_LOCALIZATION_AUDIT.txt \
              DBCS_REFACTOR_AUDIT.txt UI_RENDER_CORRUPTION_AUDIT.txt \
              NATIVE_DBCS_MIGRATION_AUDIT.txt >> SHA256SUMS.txt
            zip -9 -X -r "../${ASSET}" .
          )

          ZIP_SHA="$(sha256sum "${ASSET}" | awk '{print $1}')"
          printf '%s  %s\n' "${ZIP_SHA}" "${ASSET}" > "${ASSET}.sha256"

          cat > release-notes.md <<'EOF'
          ## MMMerge 한국어 패치 v1.0.16

          사용자 제보를 반영한 번역·UI 보완 릴리스입니다. v1.0.15의 native DBCS 렌더러 안정화 변경을 모두 포함합니다.

          ### 주요 변경
          - NEW GAME 대륙 선택 화면에 **M&M 6 / M&M 7 / M&M 8** 표기 추가
          - 캐릭터 생성 화면의 클래스/초상화 제한 해제 안내문 한국어화
          - 캐릭터 능력치 화면의 우클릭 툴팁 한국어화
          - MM7 역사책 첫 기록 **저자의 서문** 한국어화
          - **Jadame → 제이덤**, **Antagarich → 안타개릭**, **Markham → 마크햄** 용어 정리
          - `사드래곤`, `늑대 눈`, `과부쥐 열매`, `포피스냅스`, `가넷`, `이동 속도 +30` 등 제보 오역 수정
          - 수정 문자열을 번역 소스뿐 아니라 실제 배포용 `zz LocKO.T.lod`에도 반영

          ### 학자 / 교사 / 강사 보너스
          제보된 `+5% / +10% / +15%` 경험치 보너스가 화면에서 두 배로 보이던 현상을 코드로 확인했습니다.
          Merge는 이 직업들을 고정 경험치 %로 처리하지 않고 **학습(Learning) 스킬 +5 / +10 / +15**로 처리하며,
          학습 숙련도 배율이 그 수치에 적용됩니다. 따라서 전문가에서는 +10 / +20 / +30으로 보이는 것이 원래 동작입니다.
          게임 로직은 변경하지 않고 한국어 설명을 실제 동작에 맞게 수정했습니다.

          ### 검증
          - native DBCS integration 검사 통과
          - 사용자 제보 번역 회귀 검사 통과
          - 정적 LOD 용어 검사 통과
          - 능력치 툴팁 LOD 검사 통과
          - Lua 5.1 문법 검사 통과

          ### 설치
          ZIP 전체 내용을 Might and Magic 8 / MMMerge 설치 폴더에 그대로 덮어쓰십시오.
          기존 설치에서 업데이트하는 경우에도 변경 파일만 골라 넣기보다 전체 덮어쓰기를 권장합니다.
          EOF

          printf '\nZIP SHA-256:\n\n%s\n' "$ZIP_SHA" >> release-notes.md
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.16"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
            gh release edit "$TAG" --title "MMMerge 한국어 패치 v1.0.16" --notes-file release-notes.md
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
              --target "$GITHUB_SHA" \
              --title "MMMerge 한국어 패치 v1.0.16" \
              --notes-file release-notes.md
          fi
