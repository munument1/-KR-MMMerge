name: Sync Korean runtime sources from PO

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - translations/ko/mmmerge.po
      - translations/ko/PO_BASELINE.json
      - translations/ko/PO_BOOTSTRAP_REPORT.json
      - tools/build_korean_from_po.py
      - tools/build_mm8lang_from_po.py
      - tools/po_catalog_stats.py
      - tools/rebuild_runtime_overrides.py
      - tools/rebuild_stats_skills_runtime.py
      - tools/audit_runtime_translation_ownership.py
      - tools/audit_lua_korean_literals.py
      - config/runtime_override_keys.tsv
      - mm8lang.ini
      - .github/workflows/sync-po-to-korean.yml

permissions:
  contents: write

concurrency:
  group: sync-ko-from-po-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PO dependency
        run: python -m pip install --disable-pip-version-check polib

      - name: Apply Stone to Flesh wording correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import polib
          from pathlib import Path

          path = Path('translations/ko/mmmerge.po')
          po = polib.pofile(str(path))
          ctx = 'mmmerge/Text localization/LANG_ItemsTxt.txt|id=262|field=Notes'
          matches = [entry for entry in po if entry.msgctxt == ctx]
          if len(matches) != 1:
              raise SystemExit(f'expected one {ctx!r} entry, found {len(matches)}')
          entry = matches[0]
          if 'Cures Stoned.' not in entry.msgid:
              raise SystemExit(f'unexpected English source: {entry.msgid!r}')
          wrong = '취한 상태를 치료합니다.'
          correct = '석화 상태를 치료합니다.'
          if wrong in entry.msgstr:
              entry.msgstr = entry.msgstr.replace(wrong, correct, 1)
              po.save(str(path))
              print('Stone to Flesh PO translation corrected.')
          elif correct in entry.msgstr:
              print('Stone to Flesh PO translation already corrected.')
          else:
              raise SystemExit(f'unexpected Korean translation: {entry.msgstr!r}')
          PY

      - name: Require complete reviewed PO
        shell: bash
        run: |
          set -euo pipefail
          python tools/po_catalog_stats.py \
            translations/ko/mmmerge.po \
            --baseline translations/ko/PO_BASELINE.json \
            --no-regress \
            --fail-fuzzy \
            --min-translated 25051

      - name: Materialize canonical Korean runtime sources from PO
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_korean_from_po.py --write
          python tools/build_mm8lang_from_po.py --write

      - name: Refresh generated runtime projections
        shell: bash
        run: |
          set -euo pipefail
          python tools/rebuild_runtime_overrides.py --write
          python tools/rebuild_runtime_overrides.py --check
          python tools/rebuild_stats_skills_runtime.py --write
          python tools/rebuild_stats_skills_runtime.py --check

      - name: Enforce runtime ownership after materialization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python tools/audit_runtime_translation_ownership.py \
            --json build/RUNTIME_TRANSLATION_OWNERSHIP.json
          python tools/audit_lua_korean_literals.py \
            --json build/LUA_KOREAN_LITERAL_AUDIT.json
          python - <<'PY'
          import json
          from pathlib import Path

          ownership = json.loads(Path('build/RUNTIME_TRANSLATION_OWNERSHIP.json').read_text(encoding='utf-8'))
          bad_runtime = [x for x in ownership['runtime_override_duplicates'] if not x.get('same_text')]
          if bad_runtime:
              sample = [f"{x['table']}[{x['id']}] {x['field'] or '<default>'}" for x in bad_runtime[:10]]
              raise SystemExit(f'canonical-backed runtime wording drift: {sample}')
          if ownership['runtime_override_unique_keys'] != 0:
              raise SystemExit(
                  f"runtime-only overrides are no longer allowed: {ownership['runtime_override_unique_keys']}"
              )
          if ownership['lua_literal_maps_with_static_overlap'] != 0:
              raise SystemExit('hard-coded Lua translation maps overlap canonical static data')

          literals = json.loads(Path('build/LUA_KOREAN_LITERAL_AUDIT.json').read_text(encoding='utf-8'))
          allowed_runtime_ui = {
              'Scripts/General/ZZ_KoreanReportedLocalization.lua',
              'Scripts/General/ZZZ_KoreanExtraSettingsOverlay.lua',
          }
          unexpected = set(literals['scripts']) - allowed_runtime_ui
          if unexpected:
              raise SystemExit(f'Korean literals appeared in non-runtime-UI Lua files: {sorted(unexpected)}')
          if literals['exact_static_duplicate_occurrences'] != 0:
              raise SystemExit(
                  f"Lua contains {literals['exact_static_duplicate_occurrences']} exact duplicates of canonical Korean data"
              )
          print('PO-driven runtime ownership: OK (runtime-only overrides: 0)')
          PY

      - name: Require materialized files to round-trip back to PO exactly
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/po-sync-check
          python tools/build_korean_from_po.py \
            --output-root build/po-sync-check \
            --require-byte-identical
          python tools/build_mm8lang_from_po.py \
            --output build/mm8lang-sync-check.ini \
            --require-byte-identical
          python - <<'PY'
          from pathlib import Path
          raw = Path('Data/Text localization/KO_ItemsTxt.txt').read_text(encoding='cp949')
          rows = [line for line in raw.splitlines() if line.startswith('262\t')]
          if len(rows) != 1:
              raise SystemExit(f'expected exactly one item 262 row, found {len(rows)}')
          if '석화 상태를 치료합니다.' not in rows[0] or '취한 상태를 치료합니다.' in rows[0]:
              raise SystemExit('Stone to Flesh runtime text is not corrected')
          print('Stone to Flesh runtime text: OK')
          PY

      - name: Commit generated Korean runtime sources
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- translations/ko/mmmerge.po 'Data/Text localization' mm8lang.ini)" ]]; then
            echo 'Korean PO and runtime sources already match.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/ko/mmmerge.po 'Data/Text localization' mm8lang.ini
          git commit -m 'Fix Stone to Flesh potion description'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
