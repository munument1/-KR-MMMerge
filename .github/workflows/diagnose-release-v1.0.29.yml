# Rerun after making the Lua literal audit linear.
name: Diagnose v1.0.29 validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-release-v1.0.29.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check polib

      - name: PO catalog stats
        timeout-minutes: 5
        run: |
          set -euo pipefail
          time python tools/po_catalog_stats.py \
            translations/ko/mmmerge.po \
            --baseline translations/ko/PO_BASELINE.json \
            --no-regress --fail-fuzzy --min-translated 25051

      - name: PO materialization round-trip
        timeout-minutes: 10
        run: |
          set -euo pipefail
          rm -rf build/po-release-roundtrip
          time python tools/build_korean_from_po.py \
            --output-root build/po-release-roundtrip \
            --require-byte-identical

      - name: mm8lang round-trip
        timeout-minutes: 5
        run: |
          set -euo pipefail
          time python tools/build_mm8lang_from_po.py \
            --output build/mm8lang-release-roundtrip.ini \
            --require-byte-identical

      - name: Runtime overrides check
        timeout-minutes: 10
        run: |
          set -euo pipefail
          time python tools/rebuild_runtime_overrides.py --check

      - name: Stats skills runtime check
        timeout-minutes: 5
        run: |
          set -euo pipefail
          time python tools/rebuild_stats_skills_runtime.py --check

      - name: Runtime ownership audit
        timeout-minutes: 10
        run: |
          set -euo pipefail
          time python tools/audit_runtime_translation_ownership.py --json build/runtime-ownership-release.json

      - name: Lua Korean literal audit
        timeout-minutes: 10
        run: |
          set -euo pipefail
          time python tools/audit_lua_korean_literals.py --json build/lua-korean-literals-release.json
