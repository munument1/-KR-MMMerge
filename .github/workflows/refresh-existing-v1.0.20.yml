name: Refresh existing v1.0.20 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-existing-v1.0.20.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild and replace existing v1.0.20 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-v1.0.20.yml --repo "$GITHUB_REPOSITORY" --ref main
